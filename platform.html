// Cached per open Superadmins modal — the real, non-hardcoded set of
// roles this school could reassign someone to (SYSTEM_ROLES + this
// school's own custom roles), fetched once per panel load and reused by
// every row's "Change Role" picker rather than re-fetched per click.
let _rolesCache = { systemRoles: [], customRoles: [] };

function _roleLabel(key) {
  return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

async function loadSuperadmins(schoolId) {
  const listEl = document.getElementById('sa-list');
  if (!listEl) return;
  try {
    const [saJson, rolesJson] = await Promise.all([
      api('GET', `/schools/${schoolId}/superadmins`),
      api('GET', `/schools/${schoolId}/roles`).catch(() => ({ systemRoles: [], customRoles: [] })),
    ]);
    _rolesCache = rolesJson;
    const items = saJson.superadmins || [];
    if (!items.length) {
      listEl.innerHTML = '<p style="font-size:12px;color:#94a3b8;margin:0">No superadmins found for this school.</p>';
      return;
    }
    listEl.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="border-bottom:1px solid #e2e8f0">
          <th style="text-align:left;padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase">Name</th>
          <th style="text-align:left;padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase">Email</th>
          <th style="text-align:left;padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase">Status</th>
          <th style="text-align:right;padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase">Actions</th>
        </tr>
      </thead>
      <tbody>${items.map(u => `
        <tr id="sa-row-${u.id}">
          <td style="padding:6px 8px">${_esc(u.name) || '—'}</td>
          <td style="padding:6px 8px;color:#64748b">${_esc(u.email)}</td>
          <td style="padding:6px 8px">${u.isActive === false ? '<span style="color:#94a3b8">Inactive</span>' : '<span style="color:#22c55e">Active</span>'}${u.mustChangePassword ? ' <span style="color:#d97706">· must change password</span>' : ''}</td>
          <td id="sa-actions-${u.id}" style="padding:6px 8px;text-align:right;white-space:nowrap">
            <button class="pa-btn" style="font-size:11px;padding:4px 8px"
              title="Move this account to a different role — keeps their login, just changes what they can access"
              onclick="startChangeRole('${schoolId}','${u.id}','${(u.name || u.email || '').replace(/'/g, "\\'")}')">
              <i class="fas fa-people-arrows"></i> Change Role
            </button>
            <button class="pa-btn" style="font-size:11px;padding:4px 8px"
              title="Set a new temporary password — invalidates any current sessions for this account"
              onclick="resetSuperadminPassword('${schoolId}','${u.id}','${(u.email || '').replace(/'/g, "\\'")}')">
              <i class="fas fa-key"></i> Reset Password
            </button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  } catch (err) {
    listEl.innerHTML = `<p style="font-size:12px;color:#b91c1c;margin:0">Failed to load: ${err.message}</p>`;
  }
}

/* ── Change an existing superadmin's role ─────────────────
   Turns that row's action cell into a role picker in place — no modal
   hop, no reload of the rest of the panel. Options come from
   _rolesCache (fetched fresh every time the Superadmins panel opens),
   never a hardcoded list here. Closes the gap left after "Promote": the
   OUTGOING superadmin had nowhere to go afterward — Settings -> Users'
   own role dropdown refuses to touch a superadmin account, and nothing
   existed on the platform side either. */
function startChangeRole(schoolId, userId, label) {
  const cell = document.getElementById(`sa-actions-${userId}`);
  if (!cell) return;

  const allRoles = [
    ...( _rolesCache.systemRoles || [] ).map(r => ({ value: r, label: _roleLabel(r) })),
    ...( _rolesCache.customRoles || [] ).map(r => ({ value: r.key, label: r.label })),
  ];

  cell.innerHTML = `
    <select id="role-select-${userId}" class="pa-input" style="font-size:11px;padding:4px 6px">
      ${allRoles.map(r => `<option value="${_esc(r.value)}">${_esc(r.label)}</option>`).join('')}
    </select>
    <button class="pa-btn primary" style="font-size:11px;padding:4px 8px" onclick="saveChangeRole('${schoolId}','${userId}')">
      <i class="fas fa-check"></i> Save
    </button>
    <button class="pa-btn" style="font-size:11px;padding:4px 8px" onclick="loadSuperadmins('${schoolId}')">
      Cancel
    </button>`;
}

async function saveChangeRole(schoolId, userId) {
  const select = document.getElementById(`role-select-${userId}`);
  const role = select?.value;
  if (!role) return;

  const confirmed = confirm(`Change this account's role to "${_roleLabel(role)}"?\n\nThey will be signed out of their current session and must log in again to see the change.`);
  if (!confirmed) return;

  const errEl = document.getElementById('sa-error');
  const resEl = document.getElementById('sa-result');
  if (errEl) errEl.style.display = 'none';
  if (resEl) resEl.style.display = 'none';

  try {
    const json = await api('POST', `/schools/${schoolId}/superadmins/${userId}/change-role`, { role });
    toast(json.note || 'Role changed.', 'success');
    loadSuperadmins(schoolId);
  } catch (err) {
    if (errEl) { errEl.textContent = err.message; errEl.style.display = 'block'; }
    else toast('Failed: ' + err.message, 'error');
  }
}

/* ── Reset a superadmin's password ────────────────────────
   The recovery path for the exact scenario that motivated this
   feature: the one-time temp password shown by addSuperadmin() above
   is lost before it's copied (it's never stored in plaintext anywhere,
   so it genuinely cannot be recovered any other way), and Impersonate
   (below) is disabled by default in production. This sets a new
   password directly — no login, no impersonation needed. */
async function resetSuperadminPassword(schoolId, userId, email) {
  const confirmed = confirm(
    `Reset password for ${email}?\n\n` +
    `A new temporary password will be generated and any existing sessions for this account will be signed out immediately. ` +
    `The current password will stop working.`
  );
  if (!confirmed) return;

  const errEl = document.getElementById('sa-error');
  const resEl = document.getElementById('sa-result');
  errEl.style.display = 'none';
  resEl.style.display = 'none';

  try {
    const json = await api('POST', `/schools/${schoolId}/superadmins/${userId}/reset-password`);
    if (json.tempPassword) {
      resEl.innerHTML = `<strong>${_esc(email)}</strong> — new temporary password (shown once — copy it now):<br><code style="user-select:all;font-size:13px">${json.tempPassword}</code>`;
      resEl.style.display = 'block';
    }
    toast(json.note || 'Password reset.', 'success');
    loadSuperadmins(schoolId);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

async function addSuperadmin(schoolId) {
  const name    = document.getElementById('sa-name')?.value.trim();
  const email   = document.getElementById('sa-email')?.value.trim();
  const errEl   = document.getElementById('sa-error');
  const resEl   = document.getElementById('sa-result');
  errEl.style.display = 'none';
  resEl.style.display = 'none';

  if (!name || !email) {
    errEl.textContent = 'Name and email are required.';
    errEl.style.display = 'block';
    return;
  }

  try {
    const json = await api('POST', `/schools/${schoolId}/superadmins`, { name, email });
    document.getElementById('sa-name').value  = '';
    document.getElementById('sa-email').value = '';
    if (json.tempPassword) {
      resEl.innerHTML = `<strong>${email}</strong> created. Temporary password (shown once — copy it now):<br><code style="user-select:all;font-size:13px">${json.tempPassword}</code>`;
      resEl.style.display = 'block';
    }
    toast(json.note || 'Superadmin added.', 'success');
    loadSuperadmins(schoolId);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

async function promoteSuperadmin(schoolId) {
  const email = document.getElementById('sa-promote-email')?.value.trim();
  const errEl = document.getElementById('sa-error');
  const resEl = document.getElementById('sa-result');
  errEl.style.display = 'none';
  resEl.style.display = 'none';

  if (!email) {
    errEl.textContent = 'Email is required.';
    errEl.style.display = 'block';
    return;

  const confirmed = confirm(`Grant superadmin to ${email}?\n\nThey will be signed out of their current session and must log in again to see the change.`);

    resEl.style.display = 'block';

    loadSuperadmins(schoolId);

    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

/* ── Toggle active (suspend / reinstate) ────────────────── */
function toggleActive(schoolId, active, schoolName) {
  const action     = active ? 'Reinstate' : 'Suspend';
  const actionLow  = action.toLowerCase();
  const cls        = active ? 'success' : 'danger';
  const icon       = active ? 'fa-check-circle' : 'fa-ban';
  const body       = active
    ? `<strong>${schoolName}</strong> will be reactivated and its admins will be able to log in again.`
    : `<strong>${schoolName}</strong> will be suspended. All users will be locked out immediately.`;

  showModal(`${action} ${schoolName}?`, body, [
    { label: 'Cancel', cls: 'pa-btn', action: 'closeModal()' },
    { label: `<i class="fas ${icon}"></i> ${action}`, cls: `pa-btn ${cls}`,
      action: `_doToggleActive('${schoolId}',${active},'${schoolName.replace(/'/g,"\\'")}')` }
  ]);
}

async function _doToggleActive(schoolId, active, schoolName) {
  closeModal();
  try {
    await api('PATCH', `/schools/${schoolId}`, { isActive: active });
    toast(`${schoolName} ${active ? 'reinstated' : 'suspended'}`, active ? 'success' : 'info');

/* Shows "will become: {orgSlug}-{typed}" under the slug field when an
   existing organization is selected — the server derives the same value,
   this is just so the admin isn't surprised by the final slug. */
function _updateSlugHint() {
  const orgSel = document.getElementById('p-org');
  const hint   = document.getElementById('p-slug-hint');
  const slugEl = document.getElementById('p-slug');
  const opt    = orgSel?.selectedOptions?.[0];
  const orgSlug = opt?.value ? (opt.dataset.slug || '') : '';

  if (!orgSlug) { hint.style.display = 'none'; return; }

  const typed = (slugEl.value || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
  const suffix = '-' + orgSlug;
  const finalSlug = typed.endsWith(suffix) ? typed : typed + suffix;
  hint.textContent = `Will be created as: ${typed ? finalSlug : '…' + suffix}`;
  hint.style.display = 'block';
}

async function doProvision() {
  const g = id => document.getElementById(id)?.value.trim();
  const name = g('p-name'), slug = g('p-slug'), email = g('p-admin-email'), pw = g('p-admin-pw');
  const organizationId = g('p-org') || undefined;
  const errEl = document.getElementById('provision-error');
  errEl.style.display = 'none';

  if (!name || !slug || !email || !pw) {
    errEl.textContent = 'Please fill in all required fields.'; errEl.style.display = 'block'; return;
  }

  const btn = document.getElementById('provision-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Provisioning…';

  try {
    await api('POST', '/schools', {
      name, shortName: g('p-short'), slug,
      plan: g('p-plan'), currency: g('p-currency'), timezone: 'Africa/Nairobi',
      adminName: g('p-admin-name'), adminEmail: email, adminPassword: pw,
      organizationId
    });
    toast(`${name} provisioned successfully!`, 'success');
    showView('schools');
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-plus-circle"></i> Provision School';
  }
}

async function submitAnnouncement() {
  const title   = document.getElementById('ann-title')?.value.trim();
  const desc    = document.getElementById('ann-desc')?.value.trim();
  const type    = document.getElementById('ann-type')?.value;
  const sched   = document.getElementById('ann-scheduled')?.value;
  const expires = document.getElementById('ann-expires')?.value;
  const notify  = document.getElementById('ann-notify')?.checked;
  const errEl   = document.getElementById('ann-error');

  if (!title || !desc) { errEl.textContent = 'Title and description are required.'; errEl.style.display='block'; return; }
  errEl.style.display = 'none';

  try {
    const res = await apiFetch('/api/platform/announcements', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description: desc, type, scheduledAt: sched || null, expiresAt: expires || null, notifyAll: notify })
    });
    if (!res.ok) { const e = await res.json().catch(() => ({})); errEl.textContent = (typeof e.error === 'string' ? e.error : e.error?.message) || 'Request failed'; errEl.style.display='block'; return; }
    closeModal();
    toast(`Announcement created${notify ? ' — emails sent to all schools' : ''}.`, 'success');
    renderAnnouncements();
  } catch (err) {
    errEl.textContent = err.message || 'Unexpected error'; errEl.style.display='block';
  }
}

  bg.innerHTML = `

  el.className = `pa-toast ${type}`;

  wrap.appendChild(el);

}

/* ── Branding asset upload (logo/favicon) ────────────────────────
   Direct file upload replaces the old plain-URL text fields — those
   only ever accepted a real direct image URL, and a pasted Google
   Drive "file" share link is an HTML viewer page, never raw image
   bytes, so it silently rendered nothing no matter what else worked.
   File → base64 (FileReader, in-browser) → PUT, uploads immediately
   on file choice, same as the school-side logo uploader this mirrors. */
function _renderAssetPreview(type, url) {
  const el = document.getElementById(`ps-${type}-preview`);
  const fallbackIcon = type === 'logo' ? 'fa-image' : 'fa-star';
  el.innerHTML = url
    ? `<img src="${url}?t=${Date.now()}" alt="${type}" style="max-width:100%;max-height:100%;object-fit:contain"/>`
    : `<i class="fas ${fallbackIcon}" style="color:#9ca3af;font-size:${type === 'logo' ? 16 : 14}px"></i>`;
}

function uploadBrandAsset(type, inputEl) {
  const file = inputEl.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const b64 = ev.target.result;
    try {
      const body = type === 'logo' ? { logoBase64: b64 } : { faviconBase64: b64 };
      const json = await api('PUT', `/settings/${type}`, body);
      _renderAssetPreview(type, json[type === 'logo' ? 'logoUrl' : 'faviconUrl']);
      toast(`${type === 'logo' ? 'Logo' : 'Favicon'} uploaded.`, 'success');
    } catch (e) {
      toast(`Failed to upload ${type}: ${e.message}`, 'error');
    }
  };
  reader.readAsDataURL(file);
  inputEl.value = '';
}

async function removeBrandAsset(type) {
  try {
    await api('DELETE', `/settings/${type}`, {});
    _renderAssetPreview(type, null);
    toast(`${type === 'logo' ? 'Logo' : 'Favicon'} removed — reverted to default.`, 'success');
  } catch (e) {
    toast(`Failed to remove ${type}: ${e.message}`, 'error');
  }
}

/* ── CMS helpers ─────────────────────────────────────────── */
function _cmsSection(id, title, inner) {
  return `
    <div class="pa-card" id="cms-sec-${id}">
      <div class="pa-card-header" style="cursor:pointer;user-select:none" onclick="_toggleCmsSection('${id}')">
        <h3 style="margin:0;display:flex;align-items:center;gap:9px">
          <i class="fas fa-chevron-down" id="cms-chevron-${id}" style="font-size:11px;color:var(--faint);transition:transform .2s"></i>
          ${title}
        </h3>
      </div>
      <div id="cms-body-${id}" class="cms-body">
        ${inner}
      </div>
    </div>`;
}

function _toggleCmsSection(id) {
  const body = document.getElementById('cms-body-' + id);
  const icon = document.getElementById('cms-chevron-' + id);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  icon.style.transform = open ? 'rotate(-90deg)' : 'rotate(0)';
}

function _cmsVal(path, def = '') {
  const parts = path.split('.');
  let cur = _cmsData;
  for (const p of parts) { if (cur == null) return def; cur = cur[p]; }
  return (cur !== undefined && cur !== null) ? String(cur).replace(/"/g,'&quot;') : def;
}

function _v(id) {
  const el = document.getElementById(id);
  return el ? (el.tagName === 'TEXTAREA' ? el.value : el.value) : '';
}

function _convictionRows() {
  const pairs = _cmsData.conviction || [
    { before: 'Fee tracking in Excel, reconciled every Friday', after: 'Real-time fee ledger — every payment, every receipt, live' },
    { before: 'Report cards assembled manually by the registrar', after: 'Governed publishing: Teacher → HOD → Principal → Portal' },
    { before: 'Curriculum coverage tracked in a teacher\'s notebook', after: 'Syllabus tracker — every topic marked, every subject covered live' },
    { before: 'Parent notices via personal WhatsApp groups', after: 'Structured institutional channels with full audit trail' },
    { before: 'Leadership decisions on week-old paper summaries', after: 'Live director dashboard across attendance, grades, and finance' },
  ];
  return pairs.map((p, i) => `
    <div class="cms-conv-row" data-index="${i}" style="display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;align-items:center">
      <input class="cms-conv-before" type="text" placeholder="Before (old pain)" value="${(p.before||'').replace(/"/g,'&quot;')}" />
      <input class="cms-conv-after"  type="text" placeholder="After (Msingi solution)" value="${(p.after||'').replace(/"/g,'&quot;')}" />
      <button class="pa-btn-icon danger" title="Remove this pair" aria-label="Remove this pair" onclick="this.closest('.cms-conv-row').remove()">
        <i class="fas fa-trash"></i>
      </button>
    </div>`).join('');
}

function _addConvictionRow() {
  const container = document.getElementById('cms-conviction-rows');
  const idx = container.children.length;
  const div = document.createElement('div');
  div.className = 'cms-conv-row';
  div.dataset.index = idx;
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;align-items:center';
  div.innerHTML = `
    <input class="cms-conv-before" type="text" placeholder="Before (old pain)" />
    <input class="cms-conv-after"  type="text" placeholder="After (Msingi solution)" />
    <button onclick="this.closest('.cms-conv-row').remove()" style="background:#fee2e2;border:none;border-radius:6px;color:#dc2626;cursor:pointer;padding:6px">
      <i class="fas fa-trash"></i>
    </button>`;
  container.appendChild(div);
}

function _saveConviction() {
  const rows  = document.querySelectorAll('.cms-conv-row');
  const pairs = [];
  rows.forEach(row => {
    const before = row.querySelector('.cms-conv-before')?.value?.trim();
    const after  = row.querySelector('.cms-conv-after')?.value?.trim();
    if (before || after) pairs.push({ before: before || '', after: after || '' });
  });
  _saveCmsSection('conviction', pairs);
}

const ALL_ECO_NODES = ['Admissions','Student Records','Classes','Timetable','Attendance','Lessons','Grades','Behaviour','Reports','Finance','Library','Transport','Hostel','Analytics'];

function _ecoNodeToggles() {
  const enabled = _cmsData.ecosystem?.enabledNodes || ALL_ECO_NODES;

    return `<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;background:${on?'#eef2ff':'#f8fafc'};border:1px solid ${on?'#c7d2fe':'#e2e8f0'};padding:4px 10px;border-radius:20px">

function _saveEcosystem() {
  const heading    = _v('cms-eco-heading');
  const subheading = _v('cms-eco-subheading');
  const nodeDescs  = {};
  const enabledNodes = [];
  document.querySelectorAll('#cms-eco-nodes input[data-node]').forEach(cb => {
    if (cb.checked) enabledNodes.push(cb.dataset.node);
  });
  _saveCmsSection('ecosystem', { heading, subheading, enabledNodes, nodeDescs });
}

async function _saveCmsSection(section, data) {
  try {
    const res  = await fetch('/api/platform/landing-content', {
      method:      'PUT',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ section, data }),
    });
    const json = await res.json();
    if (json.success) {
      toast('✓ ' + section + ' saved successfully', 'success');
      // Update local cache
      if (!_cmsData) _cmsData = {};
      _cmsData[section] = data;
    } else {
      toast('Failed: ' + (json.error || 'Unknown error'), 'error');
    }
  } catch (err) {
    toast('Save failed: ' + err.message, 'error');
  }
}

function _injectCmsStyles() {
  if (document.getElementById('cms-styles')) return;

  `;
  document.head.appendChild(s);
}

              <th style="text-align:center;padding:8px 12px;color:#64748b;font-size:11px;text-transform:uppercase">Status</th>
              <th style="text-align:left;padding:8px 12px;color:#64748b;font-size:11px;text-transform:uppercase">Paid</th>
            </tr>
          </thead>
          <tbody>
            ${snapshots.map(s => `
              <tr style="border-bottom:1px solid #f1f5f9;hover:background:#f8fafc">
                <td style="padding:10px 12px;font-weight:600">${s.schoolName || s.schoolId}</td>
                <td style="padding:10px 12px;font-family:monospace;font-size:12px;color:#6366f1">${s.invoiceRef}</td>
                <td style="padding:10px 12px;color:#64748b">${s.academicYear} · T${s.term}</td>
                <td style="padding:10px 12px;text-align:right">${s.activeCount}</td>
                <td style="padding:10px 12px;text-align:right;font-weight:600">KSh ${(s.totalAmount||0).toLocaleString()}</td>
                <td style="padding:10px 12px;text-align:center">
                  <span style="background:${STATUS_COLOR[s.status]||'#94a3b8'}22;color:${STATUS_COLOR[s.status]||'#94a3b8'};padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:capitalize">${s.status}</span>
                </td>
                <td style="padding:10px 12px;color:#94a3b8;font-size:12px">${s.paidAt ? new Date(s.paidAt).toLocaleDateString('en-GB') : '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </div>`;

  } catch (err) {
    el.innerHTML = `<div class="pa-error">Failed to load billing data: ${err.message}</div>`;
  }
}

/* ══════════════════════════════════════════════════════════════
   PLATFORM TEAM — invite and manage operator accounts
   Visible only with the 'operators.manage' capability; every call is
   re-checked server-side.
   ══════════════════════════════════════════════════════════════ */
let _teamCatalog = null;   // { capabilities, groups, templates }
let _teamMembers = [];

function _teamStatusChip(status) {
  const map = {
    active:    ['#dcfce7', '#166534', 'Active'],
    invited:   ['#fef3c7', '#92400e', 'Invite pending'],
    suspended: ['#fee2e2', '#991b1b', 'Suspended'],
    removed:   ['#f1f5f9', '#475569', 'Removed'],
  };
  const [bg, fg, label] = map[status] || map.removed;
  return `<span style="background:${bg};color:${fg};padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap">${label}</span>`;
}

async function renderTeam() {
  const root = document.getElementById('pa-content');
  root.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading team…</div>';
  try {
    if (!_teamCatalog) _teamCatalog = await api('GET', '/operators/capabilities');
    const data = await api('GET', '/operators');
    _teamMembers = data.operators || [];
    root.innerHTML = _teamHtml();
  } catch (err) {
    root.innerHTML = `<div class="pa-empty">${_esc(_apiErrorMessage(err))}</div>`;
  }
}

function _teamHtml() {
  const templates = (_teamCatalog && _teamCatalog.templates) || [];
  const caps      = (_teamCatalog && _teamCatalog.capabilities) || [];
  const groups    = (_teamCatalog && _teamCatalog.groups) || [];

  const canGrantOwner = _can('*');

  const roleOptions = templates
    .filter(t => canGrantOwner || t.key !== 'owner')
    .map(t => `<option value="${_esc(t.key)}" title="${_esc(t.description || '')}">${_esc(t.label)}</option>`)
    .join('');

  const capToggles = groups.map(g => {
    const items = caps.filter(c => c.group === g).map(c =>
      `<label class="pa-cap-row">
         <input type="checkbox" class="pa-cap" value="${_esc(c.key)}">
         <span>${_esc(c.label)}</span>
         <code>${_esc(c.key)}</code>
       </label>`).join('');
    return `<div><div class="pa-cap-group">${_esc(g)}</div>${items}</div>`;
  }).join('');

  const rows = _teamMembers.map(op => {
    const isMe = (_me && _me.operator && _me.operator.id === op.id) || op.email === (_me && _me.operator && _me.operator.email);
    const roleSelect = `<select class="pa-input" onchange="teamChangeRole('${_esc(op.id)}', this.value)" ${isMe ? 'disabled' : ''} style="width:auto;min-width:150px;padding:5px 28px 5px 10px;font-size:12.5px">
      ${templates.map(t => `<option value="${_esc(t.key)}" ${op.template === t.key ? 'selected' : ''}>${_esc(t.label)}</option>`).join('')}
    </select>`;
    const actions = isMe
      ? '<span class="pa-muted" style="font-size:12px">You</span>'
      : `
        <div class="pa-action-wrap">
          ${op.status === 'active'
            ? `<button class="pa-btn-icon" title="Suspend — they lose access immediately" aria-label="Suspend ${_esc(op.name)}" onclick="teamSuspend('${_esc(op.id)}')"><i class="fas fa-pause"></i></button>`
            : (op.status === 'invited'
                ? `<button class="pa-btn-icon" title="Resend the invite email" aria-label="Resend invite to ${_esc(op.name)}" onclick="teamResend('${_esc(op.id)}')"><i class="fas fa-paper-plane"></i></button>`
                : `<button class="pa-btn-icon success" title="Reactivate — restore access" aria-label="Reactivate ${_esc(op.name)}" onclick="teamReactivate('${_esc(op.id)}')"><i class="fas fa-play"></i></button>`)}
          <button class="pa-btn-icon" title="Revoke sessions — forces them to sign in again" aria-label="Revoke sessions for ${_esc(op.name)}" onclick="teamRevoke('${_esc(op.id)}')"><i class="fas fa-arrow-right-from-bracket"></i></button>
          <button class="pa-btn-icon danger" title="Remove — access ends now, the record stays for the audit trail" aria-label="Remove ${_esc(op.name)}" onclick="teamRemove('${_esc(op.id)}')"><i class="fas fa-trash-can"></i></button>
        </div>`;
    const extra = (op.overrides && op.overrides.length)
      ? `<div class="pa-muted" style="font-size:11px;margin-top:3px">+ ${op.overrides.map(_esc).join(', ')}</div>` : '';
    return `<tr>
      <td><strong style="font-weight:600;color:var(--text)">${_esc(op.name)}</strong>${op.title ? `<div class="pa-muted" style="font-size:12px">${_esc(op.title)}</div>` : ''}</td>
      <td>${_esc(op.email)}</td>
      <td>${roleSelect}${extra}</td>
      <td>${_teamStatusChip(op.status)}</td>
      <td class="pa-muted" style="font-size:12px">${op.lastLoginAt ? _esc(new Date(op.lastLoginAt).toLocaleDateString('en-GB')) : '—'}</td>
      <td style="white-space:nowrap">${actions}</td>
    </tr>`;
  }).join('');

  return `
    <div class="pa-card">
      <div class="pa-card-header">
        <h3>Invite a team member</h3>
        <span class="pa-muted" style="font-size:12px">Invites expire after 72 hours</span>
      </div>
      <div class="pa-form">
        <div class="pa-form-row" style="grid-template-columns:1.1fr 1.3fr 1fr 1fr">
          <div class="pa-field">
            <label for="team-name">Full name</label>
            <input id="team-name" placeholder="e.g. Amina Otieno" autocomplete="off">
          </div>
          <div class="pa-field">
            <label for="team-email">Work email</label>
            <input id="team-email" type="email" placeholder="name@msingi.io" autocomplete="off">
          </div>
          <div class="pa-field">
            <label for="team-title">Job title <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
            <input id="team-title" placeholder="e.g. Support lead" autocomplete="off">
          </div>
          <div class="pa-field">
            <label for="team-template">Role</label>
            <select id="team-template">
              <option value="">Choose a role…</option>${roleOptions}
            </select>
          </div>
        </div>
        <details>
          <summary style="cursor:pointer;font-size:12.5px;font-weight:550;color:var(--primary);padding:2px 0">Extra capabilities beyond the role</summary>
          <div class="pa-cap-grid">${capToggles}</div>
        </details>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:15px">
          <button class="pa-btn primary" onclick="teamInvite()"><i class="fas fa-paper-plane"></i> Send invite</button>
          <span class="pa-muted" style="font-size:12px">They set their own password from the emailed link.</span>
        </div>
        <div id="team-invite-result"></div>
      </div>
    </div>

    <div class="pa-card">
      <div class="pa-card-header">
        <h3>Team</h3>
        <span class="pa-muted" style="font-size:12px">${_teamMembers.length} ${_teamMembers.length === 1 ? 'member' : 'members'}</span>
      </div>
      <div class="pa-table-wrap">
        <table class="pa-table">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last sign-in</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:var(--faint);padding:28px">No team members yet.</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;
}

async function teamInvite() {
  const name     = document.getElementById('team-name').value.trim();
  const email    = document.getElementById('team-email').value.trim();
  const title    = document.getElementById('team-title').value.trim();
  const template = document.getElementById('team-template').value;
  const capabilities = Array.from(document.querySelectorAll('.pa-cap:checked')).map(c => c.value);
  const out = document.getElementById('team-invite-result');

  if (!name || !email || !template) { out.innerHTML = '<span style="color:#b91c1c">Name, email and a role are required.</span>'; return; }

  out.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sending…';
  try {
    const res = await api('POST', '/operators/invite', { name, email, title, template, capabilities });
    /* Refresh the member table FIRST, then write the result. The order
       matters: renderTeam() replaces the whole view, so a message written
       before it would be wiped instantly — which silently swallowed the
       success confirmation, and (far worse) the invite link returned when
       the email could not be sent, leaving the inviter with no way to
       deliver it. */
    await renderTeam();
    const box = document.getElementById('team-invite-result');
    if (box) {
      box.innerHTML = res.inviteUrl
        ? `<div style="background:#fef3c7;border-radius:8px;padding:12px;font-size:13px">
             The invite was created, but the email could not be sent. Send this link to them directly:
             <div style="margin-top:6px"><input readonly value="${_esc(res.inviteUrl)}" style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:8px" onclick="this.select()"></div>
           </div>`
        : `<span style="color:#166534">Invite sent — ${_esc(email)} should receive it shortly.</span>`;
    }
  } catch (err) {
    const box = document.getElementById('team-invite-result');
    if (box) box.innerHTML = `<span style="color:#b91c1c">${_esc(err.message || 'Could not send the invite.')}</span>`;
  }
}

async function _teamAct(id, action, label) {
  try { await api('POST', `/operators/${id}/${action}`); toast(label); renderTeam(); }
  catch (err) { toast(err.message || 'Action failed', 'error'); }
}
const teamSuspend    = (id) => _teamAct(id, 'suspend', 'Member suspended');
const teamReactivate = (id) => _teamAct(id, 'reactivate', 'Member reactivated');
const teamRevoke     = (id) => _teamAct(id, 'revoke-sessions', 'Sessions revoked');
const teamResend     = (id) => _teamAct(id, 'resend-invite', 'Invite resent');

async function teamRemove(id) {
  if (!confirm('Remove this team member? They lose access immediately. This keeps their record for the audit trail.')) return;
  try { await api('DELETE', `/operators/${id}`); toast('Member removed'); renderTeam(); }
  catch (err) { toast(err.message || 'Could not remove', 'error'); }
}

async function teamChangeRole(id, template) {
  try { await api('PATCH', `/operators/${id}`, { template }); toast('Role updated'); renderTeam(); }
  catch (err) { toast(err.message || 'Could not update role', 'error'); renderTeam(); }
}

/* ── Invite acceptance (?invite=<token>) ─────────────────────
   Opened from the emailed link. Exchanges the single-use token for a
   password and signs the operator straight in. */
function _inviteTokenFromUrl() {
  return new URLSearchParams(window.location.search).get('invite');
}

function _showInvitePanel() {
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app-shell').style.display  = 'none';
  document.querySelector('#lock-screen > .pa-lock-card > h2').textContent = 'Join the platform team';
  document.querySelector('#lock-screen > .pa-lock-card > p').textContent =
    'Set a password to activate your operator account.';
  // Hide the sign-in form, show the invite form.
  document.getElementById('login-username').closest('.pa-lock-field').style.display = 'none';
  document.getElementById('login-password').closest('.pa-lock-field').style.display = 'none';
  document.getElementById('login-btn').style.display = 'none';
  document.getElementById('invite-panel').style.display = 'block';
}

async function acceptInvite() {
  const token = _inviteTokenFromUrl();
  const pw    = document.getElementById('invite-password').value;
  const pw2   = document.getElementById('invite-password2').value;
  const btn   = document.getElementById('invite-btn');
  const err   = document.getElementById('invite-error');

  if (!pw || pw.length < 8) { _showErr(err, 'Password must be at least 8 characters.'); return; }
  if (pw !== pw2)           { _showErr(err, 'The two passwords do not match.'); return; }

  btn.disabled  = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Activating…';
  err.style.display = 'none';
  try {
    const res  = await fetch('/api/platform/auth/accept-invite', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      document.getElementById('invite-password').value  = '';
      document.getElementById('invite-password2').value = '';
      window.history.replaceState({}, '', window.location.pathname); // drop the token from the URL
      await _showApp();
      return;
    }
    _showErr(err, (data && data.error && data.error.message) || 'This invite is invalid or has expired.');
  } catch (e) {
    _showErr(err, 'Could not reach the server. Please try again.');
  }
  btn.disabled  = false;
  btn.innerHTML = '<i class="fas fa-user-check"></i> Activate account';
}

async function ticketAssign(id, operatorId) {
  try {
    await api('POST', `/tickets/${id}/assign`, { operatorId: operatorId || null });
    toast(operatorId ? 'Ticket assigned' : 'Ticket unassigned');
  } catch (err) {
    toast(err.message || 'Could not assign', 'error');
  }
}

/* Same idea for the onboarding queue. A claimed school/demo request shows
   up in that operator's My Work "Onboarding" list. */
async function schoolAssign(id, operatorId) {
  try {
    await api('POST', `/schools/${_assignKey(id)}/assign`, { operatorId: operatorId || null });
    toast(operatorId ? 'Approval assigned' : 'Approval unassigned');
  } catch (err) {
    toast(err.message || 'Could not assign', 'error');
  }
}
async function demoAssign(id, operatorId) {
  try {
    await api('POST', `/demo-requests/${id}/assign`, { operatorId: operatorId || null });
    toast(operatorId ? 'Demo request assigned' : 'Demo request unassigned');
  } catch (err) {
    toast(err.message || 'Could not assign', 'error');
  }
}
/* Pending-school cards carry a Mongo _id; encode it safely for a URL. */
function _assignKey(id) { return encodeURIComponent(String(id)); }

/* Operators for the assignee picker. Loaded from the minimal directory
   route — a support agent cannot read the full team list.

   Kept SEPARATE from _teamMembers on purpose: the Team table lists
   removed and suspended members too (their record is the audit trail),
   and using that list to populate an assignee picker offered removed
   members as assignees — work that nobody would ever see. The directory
   route only returns active members, which is what a picker should offer.

   Re-fetched on demand rather than cached: it is one small request, and
   a cached copy went stale the moment someone was suspended or removed. */
let _assignableMembers = [];

async function _ensureTeamMembers() {
  try {
    const data = await api('GET', '/operators/directory');
    _assignableMembers = data.operators || [];
  } catch (e) { /* picker simply stays empty */ }
  return _assignableMembers;
}

/* ══════════════════════════════════════════════════════════════
   MY WORK — the caller's own queue plus the unassigned backlog
   ══════════════════════════════════════════════════════════════ */
async function renderMyWork() {
  const root = document.getElementById('pa-content');
  root.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading your work…</div>';
  try {
    await _ensureTeamMembers();
    const d = await api('GET', '/my-work');
    const box = (list, empty) => list.length
      ? list.map(t => _ticketCard(t)).join('')
      : `<div class="pa-empty"><p style="color:#9ca3af;font-size:13px">${empty}</p></div>`;
    root.innerHTML = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        ${[['Assigned to me', d.counts.assignedToMe, '#4f46e5'],
            ['Unassigned', d.counts.unassigned, '#f59e0b'],
            ['SLA breached', d.counts.slaBreached, '#b91c1c'],
            ['My onboarding', d.counts.myOnboarding, '#0ea5e9'],
            ['Unassigned onboarding', d.counts.unassignedOnboarding, '#8b5cf6']]
          .map(([label, n, colour]) => `<div class="pa-card" style="flex:1;min-width:140px;padding:14px 16px">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8">${label}</div>
            <div style="font-size:24px;font-weight:700;color:${colour}">${n}</div>
          </div>`).join('')}
      </div>
      <div class="pa-card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Assigned to me</h3>
        ${box(d.assignedToMe, 'Nothing assigned to you right now.')}
      </div>
      <div class="pa-card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Onboarding <span style="font-size:13px;font-weight:400;color:#94a3b8">— approvals you own</span></h3>
        ${(_onboardingRows(d.onboarding)) || '<div class="pa-empty"><p style="color:#9ca3af;font-size:13px">No onboarding items assigned to you.</p></div>'}
      </div>
      <div class="pa-card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Unassigned queue <span style="font-size:13px;font-weight:400;color:#94a3b8">— claim by opening a ticket</span></h3>
        ${box(d.unassigned, 'The unassigned queue is empty.')}
      </div>
      ${d.slaBreached.length ? `<div class="pa-card"><h3 style="margin-top:0;color:#b91c1c">Past SLA</h3>${box(d.slaBreached, '')}</div>` : ''}`;
  } catch (err) {
    root.innerHTML = `<div class="pa-empty">${_esc(_apiErrorMessage(err))}</div>`;
  }
}

/* Compact rows for the onboarding items an operator owns. */
function _onboardingRows(onboarding) {
  if (!onboarding) return '';
  const rows = [
    ...(onboarding.schools || []).map(s => ({
      label: s.name, meta: `School approval · ${s.slug || ''}`, when: s.createdAt,
      action: `onclick="showView('pending')"`, actionLabel: 'Review',
    })),
    ...(onboarding.demoRequests || []).map(r => ({
      label: r.schoolName || r.name || r.email || 'Demo request', meta: `Demo request · ${r.status || ''}`, when: r.createdAt,
      action: `onclick="showView('demos')"`, actionLabel: 'Review',
    })),
  ];
  if (!rows.length) return '';
  return `<div class="pa-table-wrap"><table class="pa-table"><tbody>${rows.map(r => `
    <tr>
      <td><strong>${_esc(r.label)}</strong><div style="font-size:12px;color:#6b7280">${_esc(r.meta)}</div></td>
      <td style="font-size:12px;color:#6b7280">${_fmtWhen(r.when)}</td>
      <td><button class="pa-btn pa-btn-sm" ${r.action}>${_esc(r.actionLabel)}</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* ── Boot: silently restore session from HttpOnly cookie ── */
window.addEventListener('DOMContentLoaded', async () => {
  // Google OAuth callback lands here as ?code=<single-use 30s exchange code>.
  // An invite link takes priority over everything, including a pending code.
  if (_inviteTokenFromUrl()) { _showInvitePanel(); return; }

  const bootParams = new URLSearchParams(window.location.search);
  const gCode   = bootParams.get('code');
  const gError  = bootParams.get('error');

  if (gCode) {
    // Drop the code from the URL immediately so a refresh can't replay it.
    window.history.replaceState({}, '', window.location.pathname);
    const ok = await _handleGoogleCode(gCode);
    return; // _showApp() was called on success; on failure we're on the lock screen
  }

  if (gError) {
    window.history.replaceState({}, '', window.location.pathname);
    const errEl = document.getElementById('login-error');
    _showErr(errEl, _GOOGLE_ERROR_MESSAGES[gError] || 'Google sign-in failed. Please try again.');
    // Fall through to probe + session check below.
  }

  _probeGoogleSignIn();

  try {
    // /me is readable by any authenticated operator regardless of role, so
    // it is the right probe for "is there a session to restore?".
    const res = await fetch('/api/platform/me', { credentials: 'include' });
    if (res.ok) { await _showApp(); }
    // 401 → stay on login screen (default)
  } catch (e) {
    // Server unreachable — stay on login screen
  }
});
</script>
</body>
</html>
