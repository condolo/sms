  <link rel="preconnect" href="https://fonts.googleapis.com">

<!-- ══ LOCK SCREEN ═════════════════════════════════════════ -->
<div id="lock-screen" class="pa-lock-screen">
  <div class="pa-lock-card">
    <div class="pa-lock-icon"><i class="fas fa-shield-halved"></i></div>
    <h2>Platform Admin</h2>
    <p>This area is restricted to Msingi system administrators. Sign in with your platform credentials.</p>

    <div class="pa-lock-field">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="Admin username"
             autocomplete="username"
             onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
    </div>

    <div class="pa-lock-field">
      <label>Password</label>
      <div class="pa-key-wrap">
        <input type="password" id="login-password" placeholder="Admin password"
               autocomplete="current-password"
               onkeydown="if(event.key==='Enter') login()">
        <button class="pa-key-toggle" onclick="togglePasswordVis(this)">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>

    <button class="pa-lock-btn" id="login-btn" onclick="login()">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign In
    </button>

    <!-- Google sign-in (team operators). Shown only when the server reports
         Google OAuth is configured — probe /api/platform/auth/google on load
         (see _probeGoogleSignIn below); a 503 means GOOGLE_CLIENT_ID is unset.
         The callback redirects here with ?code=<30s single-use exchange code>. -->
    <div class="pa-lock-alt" id="login-google-wrap" style="display:none">
      <div class="pa-lock-alt-divider"><span>or</span></div>
      <a class="pa-lock-alt-btn" id="login-google-btn"
         href="/api/platform/auth/google" target="_blank" rel="noopener"
         style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 16px;margin-top:4px;
                background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:var(--radius-sm);
                font-size:14px;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s;
                font-family:inherit;cursor:pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </a>
    </div>

    <div class="pa-lock-error" id="login-error" style="display:none"></div>

    <!-- Shown instead of the sign-in form when the page is opened from an
         invite link (?invite=<token>). The token is single-use + expiring. -->
    <div id="invite-panel" style="display:none">
      <p style="margin-top:18px">Welcome to the Msingi platform team. Choose a password to activate your account.</p>
      <div class="pa-lock-field">
        <label>New password</label>
        <input type="password" id="invite-password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="pa-lock-field">
        <label>Confirm password</label>
        <input type="password" id="invite-password2" placeholder="Repeat password" autocomplete="new-password"
               onkeydown="if(event.key==='Enter') acceptInvite()">
      </div>
      <button class="pa-lock-btn" id="invite-btn" onclick="acceptInvite()">
        <i class="fas fa-user-check"></i> Activate account
      </button>
      <div class="pa-lock-error" id="invite-error" style="display:none"></div>
    </div>
  </div>
</div>

  <!-- Main -->

      <h2 id="view-title">Overview</h2>
      <div class="pa-topbar-meta">

        Platform Admin · <span id="topbar-time"></span>
      </div>

<!-- ══ TOAST ═══════════════════════════════════════════════ -->
<div class="pa-toast-wrap" id="toast-wrap"></div>

<script>
/* ============================================================
   Msingi Platform Admin Dashboard
   ============================================================ */

let _currentView = 'overview';

/* ── HTML-escape untrusted data before interpolating into innerHTML ──
   This page is plain JS (no framework, no auto-escaping) rendering data
   that ultimately originates from the PUBLIC, unauthenticated school
   onboarding form (POST /api/onboard — schoolName, adminName, adminEmail,
   city, country) with no server-side sanitisation. Escaping HTML entities
   here is sufficient for BOTH plain-text HTML body positions (e.g.
   `<h4>${_esc(s.name)}</h4>`) and onclick="...('${_esc(s.name)}')"
   attribute positions in the same template literal: the browser HTML-
   decodes an attribute's value (turning &#39; back into ', &quot; back
   into ", etc.) BEFORE handing it to the JS engine as the event handler's
   source text — so an escaped value can never break out of the
   onclick="..." attribute OR be interpreted as HTML/script either way.
   Supersedes the old `.replace(/'/g, "\\'")` spot-fixes, which only
   protected the JS-string-literal syntax and left the `<h4>` (and the
   attribute's own double-quote boundary) unescaped. */
function _esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

/* ── Auth ───────────────────────────────────────────────── */
async function login() {
  const usernameEl = document.getElementById('login-username');
  const passwordEl = document.getElementById('login-password');
  const btn        = document.getElementById('login-btn');
  const err        = document.getElementById('login-error');

  const username = usernameEl.value.trim();
  const password = passwordEl.value;

  if (!username || !password) {
    err.textContent   = 'Please enter both username and password.';
    err.style.display = 'block';
    return;
  }

  btn.disabled  = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';
  err.style.display = 'none';

  try {
    const res  = await fetch('/api/platform/auth/login', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      passwordEl.value = '';   // clear sensitive field
      await _showApp();
    } else if (res.status === 429) {
      _showErr(err, 'Too many failed attempts. Please wait 15 minutes before trying again.');
    } else {
      var msg = (data && data.error && data.error.message) || (data && typeof data.error === 'string' && data.error) || 'Invalid credentials.';
      _showErr(err, msg);
    }
  } catch (e) {
    _showErr(err, 'Could not reach the server. Please check your connection. (' + (e && e.message ? e.message : 'network error') + ')');
  }

  btn.disabled  = false;
  btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
}

async function _showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-shell').style.display   = 'flex';
  _updateClock();
  setInterval(_updateClock, 60000);
  await _loadMe();
  showView('overview');
  if (_can('onboarding.view')) {
    api('GET', '/schools/pending').then(list => _updatePendingBadge(list.length)).catch(()=>{});
  }
}

function _showLogin(message) {
  _resetLockScreen();
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('app-shell').style.display   = 'none';
  document.getElementById('login-username').value      = '';
  document.getElementById('login-password').value      = '';
  if (message) {
    const err = document.getElementById('login-error');
    err.textContent   = message;
    err.style.display = 'block';
  }
}

/* Restore the sign-in form.
   _showInvitePanel() rewrites the lock card in place (hides the username /
   password fields and the sign-in button, shows the invite form). Without
   this reset, anyone who used an invite link and then signed out was left
   staring at the invite form with no way to sign in again — the console
   was effectively bricked in that tab until a manual refresh. Every path
   that returns to the lock screen goes through here. */
function _resetLockScreen() {
  const lock = document.getElementById('lock-screen');
  if (!lock) return;
  const heading = lock.querySelector('h2');
  const sub     = lock.querySelector('p');
  if (heading) heading.textContent = 'Platform Admin';
  if (sub) sub.textContent = 'This area is restricted to Msingi system administrators. Sign in with your platform credentials.';
  ['login-username', 'login-password'].forEach(id => {
    const field = document.getElementById(id)?.closest('.pa-lock-field');
    if (field) field.style.display = '';
  });
  const btn = document.getElementById('login-btn');
  if (btn) btn.style.display = '';
  const panel = document.getElementById('invite-panel');
  if (panel) panel.style.display = 'none';
  const err = document.getElementById('login-error');
  if (err) { err.textContent = ''; err.style.display = 'none'; }
}

function _updateClock() {
  document.getElementById('topbar-time').textContent =
    new Date().toLocaleString('en-GB', { dateStyle:'medium', timeStyle:'short' });
}

async function logout() {
  try { await fetch('/api/platform/auth/logout', { method: 'POST', credentials: 'include' }); } catch (e) {}
  _me = null;
  _showLogin();
}

/* ── Identity & capabilities ────────────────────────────────
   GET /api/platform/me tells us who is signed in and what they may do.
   The console uses it to hide sections the operator cannot use — the
   server enforces every call regardless, this is presentation only. */
let _me = { caps: [] };

function _can(cap) {
  const caps = (_me && _me.caps) || [];
  return caps.includes('*') || caps.includes(cap);
}

function _applyCapabilityUI() {
  // Sections a limited team member should not see at all.
  const gated = {
    'nav-settings':  null,           // placeholder (no such id today)
    'nav-schools':   'schools.view',
    'nav-organizations': 'schools.view',
    'nav-provision': 'onboarding.manage',
    'nav-pending':   'onboarding.view',
    'nav-demos':     'onboarding.view',
    'nav-tickets':   'tickets.view',
    'nav-billing':   'billing.view',
    'nav-diagnostics': 'diagnostics.view',
    'nav-announcements': 'content.manage',
    'nav-branding':  'content.manage',
    'nav-landing':   'content.manage',
    'nav-team':      'operators.manage',
  };
  Object.entries(gated).forEach(([id, cap]) => {
    const el = document.getElementById(id);
    if (!el || !cap) return;
    el.style.display = _can(cap) ? '' : 'none';
  });

  const who = document.getElementById('pa-whoami');
  if (who) {
    const op = (_me && _me.operator) || {};
    /* Prefer the server's human-readable role name ("Support agent") over
       the raw template key ("support_agent"). */
    const roleLabel = op.templateLabel || (op.tier === 'owner' ? 'Owner' : (op.template || 'custom'));
    /* Google profile picture (set by the Google sign-in callback); the
       src is escaped, and the server only ever persists a
       googleusercontent.com URL (validated before writing), so this is a
       trusted, narrow host — see the img-src CSP entry in server/index.js. */
    const avatar = op.picture
      ? `<img class="pa-whoami-avatar" src="${_esc(op.picture)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
      : '';
    who.innerHTML = avatar
      + `<div class="pa-whoami-text"><strong>${_esc(op.name || 'Platform Admin')}</strong>`
      + `<span class="pa-role-chip">${_esc(roleLabel)}</span></div>`;
  }

  // If the current view is no longer permitted, fall back to Overview.
  if (_currentView && _currentView !== 'overview' && gated['nav-' + _currentView] && !_can(gated['nav-' + _currentView])) {
    showView('overview');
  }
}

async function _loadMe() {
  try {
    const data = await api('GET', '/me');
    _me = data;
  } catch (e) {
    _me = { caps: [] };
  }
  _applyCapabilityUI();
}

function _showErr(el, msg) {
  el.textContent   = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function togglePasswordVis(btn) {
  const inp  = document.getElementById('login-password');
  const show = inp.type === 'text';
  inp.type = show ? 'password' : 'text';
  btn.querySelector('i').className = show ? 'fas fa-eye' : 'fas fa-eye-slash';
}

/* ── Google sign-in (team operators) ─────────────────────
   The callback redirects back to /platform?code=<30s single-use code>.
   We POST it to /auth/google/exchange, which mints platform_token exactly
   like the password login does, then re-boots the session as usual. */
const _GOOGLE_ERROR_MESSAGES = {
  google_denied:         'Google sign-in was cancelled. You can try again.',
  google_not_configured: 'Google sign-in is not enabled on this server.',
  google_failed:         'Google sign-in failed. Please try again.',
  not_an_operator:       'That Google account is not a platform operator. Ask a team lead to invite you (or sign in with your password).',
};

async function _handleGoogleCode(code) {
  const errEl = document.getElementById('login-error');
  try {
    const res  = await fetch('/api/platform/auth/google/exchange', {
      method:      'POST',
      credentials: 'include',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ code }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      window.history.replaceState({}, '', window.location.pathname); // drop ?code=
      await _showApp();
      return true;
    }
    _showErr(errEl, (data.error && data.error.message) || 'Google sign-in failed. Please try again.');
  } catch (e) {
    _showErr(errEl, 'Could not reach the server to complete Google sign-in.');
  }
  return false;
}

function _probeGoogleSignIn() {
  // Show the Google button only when the server has GOOGLE_CLIENT_ID set.
  // GET /auth/google is a cheap probe: 503 (not configured) vs 302 (ready).
  // We use HEAD + redirect:'manual' so the browser reads the 3xx status
  // WITHOUT following the redirect to accounts.google.com — that follow is
  // what trips the page's "connect-src 'self'" CSP. We only ever need the
  // status code, so a manual redirect (no body) is exactly what we want.
  fetch('/api/platform/auth/google', { method: 'HEAD', redirect: 'manual', credentials: 'include' })
    .then(r => {
      // A manual redirect yields an opaque/3xx response when configured;
      // a 503 (not configured) or opaque/0 comes back. Show the button for
      // anything that isn't an explicit 503.
      if (r.status !== 503) {
        document.getElementById('login-google-wrap').style.display = '';
      }
    })
    .catch(() => { /* server unreachable — leave hidden */ });
}

/* ── API helpers ────────────────────────────────────────── */
// CSRF double-submit (security review, 2026-09) — platform_csrf_token is
// issued alongside platform_token at login (server/routes/platform.js),
// deliberately NOT httpOnly so this can read it back and echo it in a
// header on every state-changing call. See server/utils/csrf.js for why
// SameSite=Strict alone isn't enough here.
function _platformCsrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)platform_csrf_token=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
async function api(method, path, body) {
  const opts = {
    method,
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
  };
  if (method && method.toUpperCase() !== 'GET') {
    const csrf = _platformCsrfToken();
    if (csrf) opts.headers['X-CSRF-Token'] = csrf;
  }
  if (body) opts.body = JSON.stringify(body);
  const res  = await fetch('/api/platform' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    _showLogin('Your session has expired. Please sign in again.');
    throw new Error('PLATFORM_SESSION_EXPIRED');
  }
  if (!res.ok) {
    // Preserve the HTTP status so callers can tell "you're rate-limited"
    // (429 — a normal amount of tab-clicking through this console can
    // exhaust platformLimiter's per-IP budget) apart from a genuine
    // network/server failure. Several render*() functions used to catch
    // and discard this entirely, always showing "Cannot reach the server
    // — make sure Express is running", which is actively wrong and
    // alarming when the real cause is just a rate limit clearing itself
    // in a few minutes.
    const err = new Error(data?.error?.message || data?.error || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* Shared error text for render*() catch blocks — distinguishes a rate
   limit (self-clearing, not a real problem) from an actual failure. */
function _apiErrorMessage(err) {
  if (err && err.status === 429) {
    return (err.message && err.message !== 'HTTP 429' ? err.message : 'Too many requests.')
      + ' This clears on its own after a few minutes — no action needed.';
  }
  return 'Cannot reach the server. Make sure the Express server is running and PLATFORM_ADMIN_KEY is set.';
}

/* Fetch wrapper for full-path calls — session cookie is sent automatically */
async function apiFetch(url, opts = {}) {
  opts.credentials = 'include';
  opts.headers     = opts.headers || {};
  const method = (opts.method || 'GET').toUpperCase();
  if (method !== 'GET') {
    const csrf = _platformCsrfToken();
    if (csrf) opts.headers['X-CSRF-Token'] = csrf;
  }
  return fetch(url, opts);
}

/* ── Navigation ─────────────────────────────────────────── */
function showView(view) {
  _currentView = view;
  document.querySelectorAll('.pa-nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + view)?.classList.add('active');

  const titles = { overview:'Overview', mywork:'My Work', pending:'Pending Approvals', demos:'Demo Requests', tickets:'Support Tickets', schools:'Registered Schools', organizations:'Organizations', provision:'Provision New School', announcements:'System Announcements', diagnostics:'System Diagnostics', branding:'Branding & Platform Settings', landing:'Landing Page CMS', billing:'Billing Overview', team:'Platform Team' };
  document.getElementById('view-title').textContent = titles[view] || view;

  const views = { overview: renderOverview, mywork: renderMyWork, pending: renderPending, demos: renderDemoRequests, tickets: renderTickets, schools: renderSchools, organizations: renderOrganizations, provision: renderProvision, announcements: renderAnnouncements, diagnostics: renderDiagnostics, branding: renderBranding, landing: renderLandingCMS, billing: renderBillingOverview, team: renderTeam };
  (views[view] || (() => {}))();
}

/* ── OVERVIEW ───────────────────────────────────────────── */
/* ── DEMO REQUESTS ───────────────────────────────────────── */
const _DEMO_STATUS_STYLE = {
  pending_otp:     'background:#f1f5f9;color:#475569',
  verified:        'background:#e0e7ff;color:#3730a3',
  pending_review:  'background:#fef3c7;color:#92400e',
  provisioned:     'background:#d1fae5;color:#065f46',
  rejected:        'background:#fee2e2;color:#991b1b',
  failed:          'background:#fee2e2;color:#991b1b',
  purged:          'background:#f1f5f9;color:#94a3b8',
};
function _demoBadge(status) {
  return `<span class="pa-pill ${_esc(status || '')}">${_esc((status || 'unknown').replace(/_/g, ' '))}</span>`;
}
function _fmtWhen(v) {
  if (!v) return '-';
  const d = new Date(v);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

async function renderDemoRequests() {
  const el = document.getElementById('pa-content');
  el.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading demo requests.</div>';
  try {
    await _ensureTeamMembers();

    const requests = data.requests || [];
    const pending = requests.filter(r => r.status === 'pending_review').length;
    const badge = document.getElementById('demo-badge');
    if (badge) { badge.textContent = pending; badge.style.display = pending ? 'inline-flex' : 'none'; }

    if (!requests.length) {
      el.innerHTML = `<div class="pa-card"><div class="pa-empty">
        <i class="fas fa-rocket" style="color:#6366f1;font-size:34px;margin-bottom:12px"></i>
        <p style="font-weight:600;color:#374151">No demo requests yet</p>
        <p style="color:#9ca3af;font-size:13px">Requests from the public /demo form appear here.</p>
      </div></div>`;
      return;
    }

    el.innerHTML = `
      <div class="pa-card">
        <div class="pa-card-header">
          <h3>Demo pipeline (${requests.length})</h3>
          <button class="pa-btn" onclick="renderDemoRequests()"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>
        <div style="padding:8px 0">
          ${requests.map(r => _demoRequestCard(r)).join('')}
        </div>
      </div>`;

      <i class="fas fa-triangle-exclamation" style="color:#f59e0b;margin-right:8px"></i>${_esc(_apiErrorMessage(err))}
    </div></div>`;
  }
}

function _demoRequestCard(r) {
  const tenant = r.tenantId
    ? `<span class="pending-meta"><i class="fas fa-school"></i> ${_esc(r.tenantSlug || r.tenantId)} · expires ${_fmtWhen(r.expiresAt)}</span>`
    : '';
  const actions = [];
  if (r.status === 'pending_review') {
    actions.push(`<span style="font-size:12px;color:#6b7280;display:inline-flex;align-items:center;gap:6px;margin-right:8px">
        <i class="fas fa-user-check"></i> Owner
        <select onchange="demoAssign('${r.id}', this.value)" style="border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:12px">
          <option value="">— Unassigned —</option>
          ${_assignableMembers.map(op => `<option value="${_esc(op.id)}" ${r.assigneeId === op.id ? 'selected' : ''}>${_esc(op.name)}</option>`).join('')}
        </select>
      </span>`);
    actions.push(`<button class="pa-btn success" onclick="demoApprove('${r.id}')"><i class="fas fa-check"></i> Approve</button>`);
    actions.push(`<button class="pa-btn danger" onclick="demoReject('${r.id}')"><i class="fas fa-times"></i> Reject</button>`);
  }
  if (r.status === 'provisioned' && r.tenantId) {
    actions.push(`<button class="pa-btn" onclick="demoExtend('${r.tenantId}')"><i class="fas fa-calendar-plus"></i> +7 days</button>`);
    actions.push(`<a class="pa-btn" href="/login?school=${encodeURIComponent(r.tenantSlug || '')}" target="_blank"><i class="fas fa-arrow-up-right-from-square"></i> Open</a>`);
  }
  if (r.status === 'failed') {
    actions.push(`<button class="pa-btn" onclick="demoApprove('${r.id}')"><i class="fas fa-rotate"></i> Retry</button>`);
  }
  return `
    <div class="pending-card">
      <div class="pending-card-top">
        <div class="pending-card-info">
          <h4>${_esc(r.schoolName)} ${_demoBadge(r.status)}</h4>
          <span class="pending-meta"><i class="fas fa-user"></i> ${_esc(r.name)} — ${_esc(r.email)}</span>
          <span class="pending-meta"><i class="fas fa-briefcase"></i> ${_esc(r.role) || '-'} · ${_esc(r.schoolSize) || '-'}</span>
          <span class="pending-meta"><i class="fas fa-phone"></i> ${_esc(r.phone) || '-'}</span>
          ${tenant}
        </div>
        <div class="pending-card-right">
          <span style="font-size:11px;color:var(--gray-400)">${_fmtWhen(r.createdAt)}</span>
        </div>
      </div>
      ${actions.length ? `<div class="pending-card-actions">${actions.join('')}</div>` : ''}
    </div>`;
}

async function demoApprove(id) {
  try {
    await api('POST', `/demo-requests/${id}/approve`);
    renderDemoRequests();
  } catch (err) {
    alert('Approve failed: ' + _apiErrorMessage(err));
  }
}
async function demoReject(id) {
  const reason = prompt('Reason for rejecting this demo request (emailed to the requester):');
  if (reason === null) return;
  try {
    await api('POST', `/demo-requests/${id}/reject`, { reason });

}
async function demoExtend(schoolId) {
  try {
    const res = await api('POST', `/schools/${schoolId}/extend-demo`, { days: 7 });

/* ── SUPPORT TICKETS ─────────────────────────────────────── */
const _TICKET_STATUS_STYLE = {
  open:        'background:#fee2e2;color:#991b1b',
  in_progress: 'background:#e0e7ff;color:#3730a3',
  waiting:     'background:#fef3c7;color:#92400e',
  resolved:    'background:#d1fae5;color:#065f46',
  closed:      'background:#f1f5f9;color:#475569',
};
function _ticketBadge(status) {
  return `<span class="pa-pill ${_esc(status || '')}">${_esc((status || '').replace('_', ' '))}</span>`;
}

let _ticketFilter = 'active';

async function renderTickets() {
  const el = document.getElementById('pa-content');
  el.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading tickets.</div>';
  try {
    const query = _ticketFilter === 'active' ? '?status=open,in_progress,waiting' : (_ticketFilter === 'closed' ? '?status=resolved,closed' : '');
    const data = await api('GET', '/tickets' + query);
    const tickets = data.tickets || [];

    const allData = await api('GET', '/tickets?limit=500');
    const activeCount = (allData.tickets || []).filter(t => ['open', 'in_progress', 'waiting'].includes(t.status)).length;
    const badge = document.getElementById('ticket-badge');
    if (badge) { badge.textContent = activeCount; badge.style.display = activeCount ? 'inline-flex' : 'none'; }

    const tab = (key, label) => `<button class="pa-btn ${_ticketFilter === key ? 'primary' : ''}" onclick="_ticketFilter='${key}';renderTickets()">${label}</button>`;

    el.innerHTML = `
      <div class="pa-card">
        <div class="pa-card-header">
          <h3>Tickets (${tickets.length})</h3>
          <div style="display:flex;gap:8px">
            ${tab('active', 'Active')}${tab('closed', 'Closed')}${tab('all', 'All')}
            <button class="pa-btn" onclick="newTicket()"><i class="fas fa-plus"></i> New</button>
          </div>
        </div>
        <div style="padding:8px 0">
          ${tickets.length ? tickets.map(t => _ticketCard(t)).join('') : `<div class="pa-empty"><p style="color:#9ca3af;font-size:13px">Nothing here.</p></div>`}
        </div>
      </div>`;
  } catch (err) {
    el.innerHTML = `<div class="pa-card"><div style="padding:20px;font-size:13px;color:var(--gray-500)">
      <i class="fas fa-triangle-exclamation" style="color:#f59e0b;margin-right:8px"></i>${_esc(_apiErrorMessage(err))}
    </div></div>`;
  }
}

function _ticketCard(t) {
  const prio = t.priority === 'urgent' || t.priority === 'high'
    ? `<span style="font-size:11px;font-weight:700;color:#b91c1c">${_esc(t.priority)}</span>` : '';
  return `
    <div class="pending-card" id="ticket-${t.id}">
      <div class="pending-card-top">
        <div class="pending-card-info">
          <h4>${_esc(t.ref)} · ${_esc(t.subject)} ${_ticketBadge(t.status)} ${prio}</h4>
          <span class="pending-meta"><i class="fas fa-user"></i> ${_esc(t.requesterName) || '-'} ${t.requesterEmail ? '— ' + _esc(t.requesterEmail) : ''}</span>
          <span class="pending-meta"><i class="fas fa-tag"></i> ${_esc(t.category)} · ${_esc(t.source || 'manual')}</span>
          ${t.requesterRole ? `<span class="pending-meta"><i class="fas fa-user-tag"></i> ${_esc(t.requesterRole)}</span>` : ''}
          ${t.schoolName ? `<span class="pending-meta"><i class="fas fa-school"></i> ${_esc(t.schoolName)}</span>` : ''}
          ${t.tenantId ? `<span class="pending-meta"><i class="fas fa-school"></i> ${_esc(t.tenantId)}</span>` : ''}
        </div>
        <div class="pending-card-right">
          <span style="font-size:11px;color:var(--gray-400)">${_fmtWhen(t.updatedAt)}</span>
        </div>
      </div>
      <div class="pending-card-actions">
        <button class="pa-btn" onclick="openTicket('${t.id}')"><i class="fas fa-comments"></i> Open</button>
        ${t.status !== 'resolved' && t.status !== 'closed'
          ? `<button class="pa-btn success" onclick="setTicketStatus('${t.id}','resolved')"><i class="fas fa-check"></i> Resolve</button>`
          : `<button class="pa-btn" onclick="setTicketStatus('${t.id}','open')"><i class="fas fa-rotate-left"></i> Reopen</button>`}
      </div>
    </div>`;
}

async function openTicket(id) {
  try {
    await _ensureTeamMembers();
    const data = await api('GET', `/tickets/${id}`);
    const t = data.ticket;
    const messages = (t.messages || []).map(m => `
      <div style="border-left:3px solid ${m.internal ? '#f59e0b' : '#6366f1'};padding:8px 12px;margin:8px 0;background:${m.internal ? '#fffbeb' : '#f8fafc'};border-radius:6px">
        <p style="font-size:12px;color:#475569;margin:0 0 4px"><strong>${_esc(m.author)}</strong> · ${_fmtWhen(m.createdAt)}${m.internal ? ' · internal note' : ''}</p>
        <p style="font-size:13px;color:#1f2937;margin:0;white-space:pre-wrap">${_esc(m.body)}</p>
      </div>`).join('') || '<p style="font-size:13px;color:#9ca3af">No messages yet.</p>';

    const html = `
      <div style="padding:16px 18px">
        <p style="font-size:13px;color:#374151;white-space:pre-wrap;margin:0 0 10px">${_esc(t.description) || '<em>No description</em>'}</p>
        <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap">
          <span style="font-size:12px;color:#6b7280"><i class="fas fa-user-check"></i> Assigned to:</span>
          <select id="ticket-assignee-${t.id}" onchange="ticketAssign('${t.id}', this.value)"
                  style="border:1px solid #d1d5db;border-radius:6px;padding:4px 8px;font-size:12px">
            <option value="">— Unassigned —</option>
            ${_assignableMembers.map(op => `<option value="${_esc(op.id)}" ${t.assigneeId === op.id ? 'selected' : ''}>${_esc(op.name)}</option>`).join('')}
          </select>
          ${t.slaDueAt ? `<span style="font-size:12px;color:${new Date(t.slaDueAt) < new Date() ? '#b91c1c' : '#6b7280'}">SLA ${new Date(t.slaDueAt) < new Date() ? 'breached' : 'due'} ${_fmtWhen(t.slaDueAt)}</span>` : ''}
        </div>
        ${messages}
        <textarea id="ticket-reply-${t.id}" rows="3" placeholder="Reply (visible in the platform console only)…"
          class="pa-input" style="margin-top:10px"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="pa-btn primary" onclick="ticketReply('${t.id}', false)">Send reply</button>
          <button class="pa-btn" onclick="ticketReply('${t.id}', true)">Add internal note</button>
        </div>
      </div>`;
    const card = document.getElementById(`ticket-${id}`);
    if (card) {
      const existing = card.querySelector('.ticket-detail');
      if (existing) { existing.remove(); return; }
      const div = document.createElement('div');
      div.className = 'ticket-detail';
      div.style.borderTop = '1px solid var(--gray-200, #e5e7eb)';
      div.innerHTML = html;
      card.appendChild(div);
    }
  } catch (err) {
    alert('Could not open ticket: ' + _apiErrorMessage(err));
  }
}

async function ticketReply(id, internal) {
  const box = document.getElementById(`ticket-reply-${id}`);
  if (!box || !box.value.trim()) return;
  try {
    await api('POST', `/tickets/${id}/messages`, { body: box.value.trim(), internal });
    openTicket(id); // collapse
    openTicket(id); // reopen with the new message
  } catch (err) {
    alert('Reply failed: ' + _apiErrorMessage(err));
  }
}

async function setTicketStatus(id, status) {
  try {
    await api('PATCH', `/tickets/${id}`, { status });
    renderTickets();
  } catch (err) {
    alert('Update failed: ' + _apiErrorMessage(err));
  }
}

async function newTicket() {
  const subject = prompt('Ticket subject:');
  if (!subject) return;
  const description = prompt('Description (optional):') || '';
  const email = prompt('Requester email (optional):') || '';
  try {
    await api('POST', '/tickets', { subject, description, requesterEmail: email, category: 'support' });
    renderTickets();
  } catch (err) {
    alert('Could not create ticket: ' + _apiErrorMessage(err));
  }
}

/* ── PENDING APPROVALS ──────────────────────────────────── */
async function renderPending() {
  const el = document.getElementById('pa-content');
  el.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading pending schools…</div>';

  try {
    await _ensureTeamMembers();

      el.innerHTML = `
        <div class="pa-card">
          <div class="pa-empty">
            <i class="fas fa-check-circle" style="color:#22c55e;font-size:36px;margin-bottom:12px"></i>

        <div class="pending-list">

  const sections   = _esc((s.sections   || []).join(', ') || '—');
  return `
    <div class="pending-card" id="pc-${s._id}">
      <div class="pending-card-top">
        <div class="pending-card-info">
          <h4>${_esc(s.name)}</h4>
          <span class="pending-meta"><i class="fas fa-link"></i> ${_esc(s.slug) || '—'}</span>
          <span class="pending-meta"><i class="fas fa-user"></i> ${_esc(s.adminName) || '—'} · ${_esc(s.adminEmail) || '—'}</span>
          <span class="pending-meta"><i class="fas fa-map-marker-alt"></i> ${_esc(s.city) || '—'}, ${_esc(s.country) || '—'}</span>
          <span class="pending-meta"><i class="fas fa-book"></i> ${curriculum}</span>
          <span class="pending-meta"><i class="fas fa-layer-group"></i> ${sections}</span>

            <option value="">— Unassigned —</option>
            ${_assignableMembers.map(op => `<option value="${_esc(op.id)}" ${s.assigneeId === op.id ? 'selected' : ''}>${_esc(op.name)}</option>`).join('')}
          </select>
        </span>
        <button class="pa-btn success" onclick="approveSchool('${s._id}','${_esc(s.name)}')">

function _updatePendingBadge(count) {
  const badge = document.getElementById('pending-badge');
  if (!badge) return;
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

async function approveSchool(schoolId, schoolName) {
  showModal(
    `Approve ${schoolName}?`,
    `Approving <strong>${schoolName}</strong> will activate their account and send them a welcome email with login instructions.`,
    [
      { label:'Cancel',  cls:'pa-btn', action:'closeModal()' },
      { label:'✓ Approve', cls:'pa-btn success', action:`doApprove('${schoolId}')` }
    ]
  );
}

async function doApprove(schoolId) {
  closeModal();
  try {
    await api('POST', `/schools/${schoolId}/approve`);
    toast('School approved and welcome email sent!', 'success');
    renderPending();
    // Also refresh badge
    api('GET', '/schools/pending').then(list => _updatePendingBadge(list.length)).catch(()=>{});
  } catch (err) {
    toast('Approval failed: ' + err.message, 'error');
  }
}

function rejectSchool(schoolId, schoolName) {
  showModal(
    `Reject ${schoolName}?`,
    `<p style="margin-bottom:12px">Rejecting will notify the school admin by email. You can provide an optional reason:</p>
     <textarea id="reject-reason" placeholder="Optional reason for rejection…"
       style="width:100%;height:80px;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;font-family:inherit;resize:vertical"></textarea>`,
    [
      { label:'Cancel', cls:'pa-btn', action:'closeModal()' },
      { label:'✗ Reject', cls:'pa-btn danger', action:`doReject('${schoolId}')` }
    ]
  );
}

async function doReject(schoolId) {
  const reason = document.getElementById('reject-reason')?.value.trim() || '';
  closeModal();
  try {
    await api('POST', `/schools/${schoolId}/reject`, { reason });
    toast('School rejected. Notification email sent.', 'info');
    renderPending();
    api('GET', '/schools/pending').then(list => _updatePendingBadge(list.length)).catch(()=>{});
  } catch (err) {
    toast('Rejection failed: ' + err.message, 'error');
  }
}

/* ── SCHOOLS ────────────────────────────────────────────── */
async function renderSchools() {
  const el = document.getElementById('pa-content');
  el.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading schools…</div>';

  try {
    const schools = await api('GET', '/schools');
    if (!schools.length) {
      el.innerHTML = `<div class="pa-card"><div class="pa-empty"><i class="fas fa-school"></i><p>No schools registered yet.</p></div></div>`;
      return;
    }
    _renderSchoolsTable(el, schools);
  } catch (err) {
    el.innerHTML = `
      <div class="pa-card">
        <div class="pa-card-header"><h3>Registered Schools</h3></div>
        <div style="padding:20px;font-size:13px;color:var(--gray-500)">
          <i class="fas fa-triangle-exclamation" style="color:#f59e0b;margin-right:8px"></i>
          ${_esc(_apiErrorMessage(err))}
        </div>
      </div>`;
  }
}

function _renderSchoolsTable(el, schools) {
  el.innerHTML = `
    <div class="pa-card">
      <div class="pa-card-header">
        <h3>Registered Schools (${schools.length})</h3>
        <div style="display:flex;gap:8px">
          <button class="pa-btn" onclick="wipeAllSchools()"
            style="color:#dc2626;border-color:#fca5a5;font-size:12px">
            <i class="fas fa-fire"></i> Wipe All
          </button>
          <button class="pa-btn primary" onclick="showView('provision')">
            <i class="fas fa-plus"></i> Add School
          </button>
        </div>
      </div>
      <div class="pa-table-wrap">
        <table class="pa-table">
          <thead>
            <tr>
              <th>School</th>
              <th>Slug</th>
              <th>Plan</th>
              <th>Plan Expires</th>
              <th>Status</th>
              <th>Students</th>
              <th>Staff</th>
              <th>Trial Ends</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${schools.map(s => _schoolRow(s)).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function _schoolRow(s) {
  const trial = s.trialEnds ? new Date(s.trialEnds) : null;
  const trialStr = trial
    ? (trial < new Date() ? '<span style="color:#ef4444">Expired</span>' : trial.toLocaleDateString('en-GB'))
    : '-';
  const planExp    = s.planExpiresAt ? new Date(s.planExpiresAt) : null;
  const planExpStr = planExp
    ? (planExp < new Date()
        ? `<span style="color:#ef4444;font-weight:600">${planExp.toLocaleDateString('en-GB')} (expired)</span>`
        : planExp.toLocaleDateString('en-GB'))
    : '-';
  const status = !s.isActive ? 'inactive' : (trial && trial > new Date() ? 'trial' : 'active');
  const statusLabel = !s.isActive ? 'Suspended' : (status === 'trial' ? 'Trial' : 'Active');

  return `
    <tr>
      <td>
        <strong style="display:block;font-size:13px;font-weight:600;color:var(--text)">${_esc(s.name)}</strong>
        <span class="pa-muted" style="font-size:11.5px">${_esc(s.email)||''}</span>
      </td>
      <td><code class="slug" title="${_esc(s.slug)}">${_esc(s.slug)||'—'}</code></td>
      <td><span class="plan-pill ${s.plan||'core'}">${_esc(s.plan)||'core'}</span></td>
      <td>${planExpStr}</td>
      <td><span class="status-dot ${status}">${statusLabel}</span></td>
      <td>${s._stats?.students ?? '—'}</td>
      <td>${s._stats?.staff   ?? '—'}</td>
      <td>${trialStr}</td>
      <td>
        <div class="pa-action-wrap">
          <button class="pa-btn" title="Sign in as this school's admin" onclick="confirmImpersonate('${s._id}','${_esc(s.name)}')">
            <i class="fas fa-user-secret"></i> Log in
          </button>
          <button class="pa-btn-icon" title="Change plan" aria-label="Change plan for ${_esc(s.name)}" onclick="changePlan('${s._id}','${_esc(s.plan)}','${_esc(s.name)}','${_esc(s.planExpiresAt || '')}')">
            <i class="fas fa-layer-group"></i>
          </button>
          <button class="pa-btn-icon" title="Rename school (its slug is fixed)" aria-label="Rename ${_esc(s.name)}" onclick="editSchoolName('${s._id}','${_esc(s.name)}')">
            <i class="fas fa-pen"></i>
          </button>
          <button class="pa-btn-icon" title="Grant or revoke capabilities regardless of plan" aria-label="Entitlements for ${_esc(s.name)}" onclick="showEntitlements('${s._id}','${_esc(s.name)}')">
            <i class="fas fa-unlock"></i>
          </button>
          <button class="pa-btn-icon" title="View and add superadmin accounts" aria-label="Superadmins for ${_esc(s.name)}" onclick="showSuperadmins('${s._id}','${_esc(s.name)}')">
            <i class="fas fa-user-shield"></i>
          </button>
          ${s.isActive
            ? `<button class="pa-btn-icon danger" title="Suspend school" aria-label="Suspend ${_esc(s.name)}" onclick="toggleActive('${s._id}',false,'${_esc(s.name)}')"><i class="fas fa-ban"></i></button>`
            : `<button class="pa-btn-icon success" title="Reinstate school" aria-label="Reinstate ${_esc(s.name)}" onclick="toggleActive('${s._id}',true,'${_esc(s.name)}')"><i class="fas fa-check"></i></button>`
          }
          <button class="pa-btn-icon danger" title="Delete school permanently" aria-label="Delete ${_esc(s.name)}"
            onclick="deleteSchool('${s._id}','${_esc(s.name)}')">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </td>
    </tr>`;
}

/* ── ORGANIZATIONS ──────────────────────────────────────── */
let _orgsCache = [];

async function renderOrganizations() {
  const el = document.getElementById('pa-content');
  el.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading organizations…</div>';

  try {
    const json = await api('GET', '/organizations');
    const orgs = json.organizations || [];
    _orgsCache = orgs;

    if (!orgs.length) {
      el.innerHTML = `<div class="pa-card"><div class="pa-empty"><i class="fas fa-sitemap"></i><p>No organizations yet.</p></div></div>`;
      return;
    }

    const totalSchools    = orgs.reduce((sum, o) => sum + o._stats.schoolCount, 0);
    const multiSchoolOrgs = orgs.filter(o => o._stats.schoolCount > 1).length;

    el.innerHTML = `
      <div class="pa-stats" style="margin-bottom:20px">
        <div class="pa-stat-card">
          <div class="pa-stat-label">Total Organizations</div>
          <div class="pa-stat-value">${orgs.length}</div>
          <div class="pa-stat-sub">${totalSchools} school(s) total</div>
        </div>
        <div class="pa-stat-card">
          <div class="pa-stat-label">Multi-School Orgs</div>
          <div class="pa-stat-value">${multiSchoolOrgs}</div>
          <div class="pa-stat-sub">with 2+ schools</div>
        </div>
        <div class="pa-stat-card">
          <div class="pa-stat-label">Unlinked Schools</div>
          <div class="pa-stat-value" style="${json.unlinkedSchools ? 'color:#f59e0b' : ''}">${json.unlinkedSchools || 0}</div>
          <div class="pa-stat-sub">missing an organization</div>
        </div>
      </div>

      <div class="pa-card">
        <div class="pa-card-header">
          <h3>Organizations (${orgs.length})</h3>
          <button class="pa-btn primary" onclick="showCreateOrganization()">
            <i class="fas fa-plus"></i> Create Organization
          </button>
        </div>
        <div class="pa-table-wrap">
          <table class="pa-table">
            <thead>
              <tr>
                <th>Organization</th>
                <th>Slug</th>
                <th>Shared Portal URL</th>
                <th>Schools</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${orgs.map(o => _orgRow(o)).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch (err) {
    el.innerHTML = `<div class="pa-error">Failed to load organizations: ${err.message}</div>`;
  }
}

function _orgRow(o) {
  const created = o.createdAt ? new Date(o.createdAt).toLocaleDateString('en-GB') : '—';
  const names   = o.schools.map(s => s.name).join(', ') || '—';
  const namesShort = names.length > 40 ? names.slice(0, 40) + '…' : names;
  const portalCell = o.multiSchoolEnabled
    ? `<code style="font-size:11px;background:var(--gray-100);padding:2px 6px;border-radius:4px">${o.slug}.msingi.io</code> <span title="Still requires platform-wide identity cutover to be functionally live" style="color:#22c55e;font-size:11px"><i class="fas fa-circle"></i></span>`
    : `<span style="color:var(--gray-400);font-size:12px">— (multi-school off)</span>`;
  return `
    <tr>
      <td><strong style="font-size:13px;color:var(--gray-900)">${o.name}</strong></td>
      <td><code style="font-size:12px;background:var(--gray-100);padding:2px 6px;border-radius:4px">${o.slug||'—'}</code></td>
      <td>${portalCell}</td>
      <td>${o._stats.schoolCount} <span style="color:var(--gray-400);font-size:12px">(${namesShort})</span></td>
      <td><span class="status-dot ${o.status === 'active' ? 'active' : ''}">${o.status || '—'}</span></td>
      <td style="color:var(--gray-400);font-size:12px">${created}</td>
      <td>
        <div class="pa-action-wrap">
          <button class="pa-btn" title="View member schools" onclick="viewOrgSchools('${o.id}')">
            <i class="fas fa-eye"></i> View Schools
          </button>
          <button class="pa-btn-icon" title="Multi-school and shared-slug-login settings" aria-label="Multi-school settings for ${_esc(o.name)}" onclick="showOrgActivation('${o.id}')">
            <i class="fas fa-sliders-h"></i>
          </button>
          <button class="pa-btn-icon" title="Rename organization (its slug is fixed)" aria-label="Rename ${_esc(o.name)}" onclick="editOrgName('${o.id}','${o.name.replace(/'/g,"\\'")}')">
            <i class="fas fa-pen"></i>
          </button>
          <button class="pa-btn-icon" title="Logo, colour, tagline and login background for this org's shared portal" aria-label="Branding for ${_esc(o.name)}" onclick="showOrgBranding('${o.id}')">
            <i class="fas fa-palette"></i>
          </button>
          <button class="pa-btn-icon" title="Add a read-only Group Director/CEO account for this organization" aria-label="Add director to ${_esc(o.name)}" onclick="showAddDirector('${o.id}','${o.name.replace(/'/g,"\\'")}')" ${o._stats.activeCount === 0 ? 'disabled' : ''}>
            <i class="fas fa-chart-line"></i>
          </button>
        </div>
      </td>
    </tr>`;
}

/* ── Group Director (read-only, cross-org analytics) ─────── */
function showAddDirector(orgId, orgName) {
  showModal(
    `Add Group Director — ${orgName}`,
    `<div style="display:flex;flex-direction:column;gap:12px;text-align:left">
      <p style="font-size:12px;color:#64748b;margin:0">
        Creates a read-only account that automatically sees a merged analytics dashboard across every
        <strong>active school in this organization</strong> — attendance, fees, behaviour, and academic
        performance rolled up and compared side by side. No access to any school's settings or day-to-day
        operations. Adding a school to this org later means it appears here automatically, no extra step.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">
          <label class="pa-label" style="font-size:11px">Name</label>
          <input id="dir-name" class="pa-input" placeholder="Full name" style="width:100%">
        </div>
        <div style="flex:1;min-width:180px">
          <label class="pa-label" style="font-size:11px">Email</label>
          <input id="dir-email" type="email" class="pa-input" placeholder="director@example.com" style="width:100%">
        </div>
      </div>
      <button class="pa-btn primary" onclick="addDirector('${orgId}')" style="align-self:flex-start"><i class="fas fa-plus"></i> Create Account</button>
      <p style="font-size:11px;color:#94a3b8;margin:0">A random temporary password is generated and shown once — the director must change it on first login.</p>
      <div id="dir-result" style="display:none;padding:10px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;font-size:12px;color:#166534"></div>
      <div id="dir-error" style="display:none;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;font-size:12px;color:#b91c1c"></div>
    </div>`,
    [{ label: 'Close', cls: 'pa-btn', action: 'closeModal()' }]
  );
}

async function addDirector(orgId) {
  const name  = document.getElementById('dir-name')?.value.trim();
  const email = document.getElementById('dir-email')?.value.trim();
  const errEl = document.getElementById('dir-error');
  const resEl = document.getElementById('dir-result');
  errEl.style.display = 'none';
  resEl.style.display = 'none';

  if (!name || !email) {
    errEl.textContent = 'Name and email are required.';
    errEl.style.display = 'block';
    return;
  }

  try {
    const json = await api('POST', `/organizations/${orgId}/director`, { name, email });
    document.getElementById('dir-name').value  = '';
    document.getElementById('dir-email').value = '';
    resEl.innerHTML = `<strong>${email}</strong> created (anchored at ${json.anchorSchool?.name || '—'}).` +
      (json.tempPassword ? ` Temporary password (shown once — copy it now):<br><code style="user-select:all;font-size:13px">${json.tempPassword}</code>` : '');
    resEl.style.display = 'block';
    toast(json.note || 'Group Director added.', 'success');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

/* Multi-school activation modal (org-shared-slug feature). One switch —
   originally two (multi-school mode, then a separate org-slug-login
   surface requiring it first), collapsed into one after real usage
   showed the split added an activation step without adding real safety
   (see ADR-0007's amendment note). Re-renders itself after the toggle
   call (rather than closing) so an admin can see the resulting state and
   the identity-migration readiness info returned by the API. */
function showOrgActivation(orgId) {
  const org = _orgsCache.find(o => o.id === orgId);
  if (!org) return;

  const multiOn = !!org.multiSchoolEnabled;

  showModal(
    `Multi-School Settings — ${org.name}`,
    `<div style="display:flex;flex-direction:column;gap:14px;text-align:left">
      <div class="pa-note">
        Enabling this activates JWT enrichment and the school switcher for already-authenticated staff, <strong>and</strong> makes this organization's slug (<code>${org.slug}.msingi.io</code>) a shared login page. The login page is only functionally live once the platform-wide <code>IDENTITY_CUTOVER_ENABLED</code> environment variable is also set — a global, operator-only lever this dashboard cannot flip or verify.
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #e5e7eb;border-radius:6px">
        <div>
          <div style="font-size:13px;font-weight:600;color:#111827">Multi-School Mode</div>
          <div style="font-size:11px;color:#94a3b8">JWT orgId/membershipId, school switcher (C9), and shared org-slug login page</div>
        </div>
        ${multiOn
          ? `<button class="pa-btn" style="padding:4px 10px;font-size:12px;color:#b91c1c" onclick="doDisableMultiSchool('${org.id}')"><i class="fas fa-toggle-on"></i> Disable</button>`
          : `<button class="pa-btn primary" style="padding:4px 10px;font-size:12px" onclick="doEnableMultiSchool('${org.id}')"><i class="fas fa-toggle-off"></i> Enable</button>`}
      </div>

      <div id="org-activation-status" style="font-size:11px;color:#94a3b8"></div>
    </div>`,
    [{ label: 'Close', cls: 'pa-btn', action: 'closeModal(); renderOrganizations();' }]
  );
}

function _updateOrgCache(orgId, patch) {
  const idx = _orgsCache.findIndex(o => o.id === orgId);
  if (idx >= 0) Object.assign(_orgsCache[idx], patch);
}

async function doEnableMultiSchool(orgId) {
  try {
    const json = await api('POST', `/organizations/${orgId}/enable-multi-school`, {});
    _updateOrgCache(orgId, { multiSchoolEnabled: true });
    toast(json.note || 'Multi-school mode enabled.', 'success');
    showOrgActivation(orgId);
    const statusEl = document.getElementById('org-activation-status');
    if (statusEl && json.identityMigration) {
      const im = json.identityMigration;
      statusEl.textContent = `Identity cutover readiness: ${im.status} (${im.identityBackfillPending ?? 0} pending, ${im.collisionPending ?? 0} unresolved collisions).`;
    }
  } catch (err) { toast(err.message, 'error'); }
}

async function doDisableMultiSchool(orgId) {
  try {
    await api('POST', `/organizations/${orgId}/disable-multi-school`, {});
    _updateOrgCache(orgId, { multiSchoolEnabled: false });
    toast('Multi-school mode disabled.', 'success');
    showOrgActivation(orgId);
  } catch (err) { toast(err.message, 'error'); }
}

function viewOrgSchools(orgId) {
  const org = _orgsCache.find(o => o.id === orgId);
  if (!org) return;

  const rows = (org.schools || []).map(s => `
    <tr>
      <td style="padding:8px 10px;font-weight:600">${_esc(s.name)}</td>
      <td style="padding:8px 10px"><span class="plan-pill ${s.plan||'core'}">${_esc(s.plan)||'core'}</span></td>
      <td style="padding:8px 10px">${s.isActive ? '<span style="color:#22c55e">Active</span>' : '<span style="color:#ef4444">Inactive</span>'}</td>
      <td style="padding:8px 10px">
        <button class="pa-btn" style="padding:4px 10px;font-size:12px" title="Grant an existing person access to this school" onclick="showLinkIdentity('${s.id}', '${_esc(s.name)}')">
          <i class="fas fa-link"></i> Link Identity
        </button>
      </td>
    </tr>`).join('');

  showModal(
    `${org.name} — ${org._stats.schoolCount} school(s)`,
    `<table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead>
        <tr style="border-bottom:2px solid #e2e8f0">
          <th style="text-align:left;padding:8px 10px;color:#64748b;font-size:11px;text-transform:uppercase">School</th>
          <th style="text-align:left;padding:8px 10px;color:#64748b;font-size:11px;text-transform:uppercase">Plan</th>
          <th style="text-align:left;padding:8px 10px;color:#64748b;font-size:11px;text-transform:uppercase">Status</th>
          <th style="text-align:left;padding:8px 10px;color:#64748b;font-size:11px;text-transform:uppercase">Identity</th>
        </tr>
      </thead>
      <tbody>${rows || '<tr><td colspan="4" style="padding:12px;color:#94a3b8">No schools linked.</td></tr>'}</tbody>
    </table>`,
    [{ label: 'Close', cls: 'pa-btn', action: 'closeModal()' }]
  );
}

/* Search-and-confirm modal for granting an existing person access to a
   second school under the SAME organization. Record-only on the backend
   (POST /memberships) — the success toast echoes the API's `note` field
   verbatim so the limitation (doesn't enable login yet) is visible in
   the moment, not just documented in a comment. */
function showLinkIdentity(schoolId, schoolName) {
  showModal(
    `Link Identity — ${schoolName}`,
    `<div style="display:flex;flex-direction:column;gap:12px;text-align:left">
      <p style="font-size:12px;color:#64748b;margin:0">
        Search for an existing person by email, then grant them access to <strong>${schoolName}</strong>.
        This only links people already registered under the same organization — it does not create a new account,
        and it does not by itself let them log into this school yet.
      </p>
      <div style="display:flex;gap:8px">
        <input id="li-email" class="pa-input" placeholder="Search by email…" style="flex:1" onkeydown="if(event.key==='Enter'){searchLinkIdentity('${schoolId}')}">
        <button class="pa-btn" onclick="searchLinkIdentity('${schoolId}')"><i class="fas fa-search"></i> Search</button>
      </div>
      <div id="li-results" style="min-height:20px"></div>
      <div id="li-error" style="display:none;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;font-size:12px;color:#b91c1c"></div>
    </div>`,
    [{ label: 'Close', cls: 'pa-btn', action: 'closeModal()' }]
  );
}

async function searchLinkIdentity(schoolId) {
  const email     = document.getElementById('li-email')?.value.trim();
  const resultsEl = document.getElementById('li-results');
  const errEl     = document.getElementById('li-error');
  errEl.style.display = 'none';

  if (!email || email.length < 3) {
    errEl.textContent = 'Type at least 3 characters of the email to search.';
    errEl.style.display = 'block';
    return;
  }

  resultsEl.innerHTML = '<div class="pa-loading"><i class="fas fa-circle-notch fa-spin"></i> Searching…</div>';
  try {
    const json  = await api('GET', `/users/search?email=${encodeURIComponent(email)}`);
    const users = json.users || [];

    if (!users.length) {
      resultsEl.innerHTML = '<p style="font-size:12px;color:#94a3b8;margin:0">No matching users found.</p>';
      return;
    }

    resultsEl.innerHTML = users.map(u => `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid #e5e7eb;border-radius:6px;margin-bottom:6px">
        <div>
          <div style="font-size:13px;font-weight:600;color:#111827">${_esc(u.name) || _esc(u.email)}</div>
          <div style="font-size:11px;color:#94a3b8">${_esc(u.email)} · ${_esc(u.role) || '—'} · ${_esc(u.schoolName) || 'no current school'}</div>
        </div>
        <button class="pa-btn primary" style="padding:4px 10px;font-size:12px" onclick="grantLinkIdentity('${u.id}', '${schoolId}')">
          <i class="fas fa-link"></i> Grant Access
        </button>
      </div>`).join('');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

async function grantLinkIdentity(userId, schoolId) {
  const errEl = document.getElementById('li-error');
  errEl.style.display = 'none';
  try {
    const json = await api('POST', '/memberships', { userId, schoolId });
    closeModal();
    toast(json.note || 'Membership created.', 'success');
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

function showCreateOrganization() {
  showModal(
    'Create Organization',
    `<div style="display:flex;flex-direction:column;gap:12px;text-align:left">

// Security Baseline Register, PLAT-01 remediation — this modal used to
// have no reason input at all, yet the API has required and recorded one
// since PLAT-02 (see server/routes/platform.js's impersonate route). That
// meant every impersonation attempt through this exact console — the only
// UI that calls this endpoint — 400'd, every time. Fixed to actually
// collect and send it, matching the reject-reason modal's own pattern
// just above.
function confirmImpersonate(schoolId, schoolName) {
  showModal(
    `Log in as ${schoolName}`,
    `<p style="margin-bottom:12px">You are about to impersonate the Super Admin of <strong>${schoolName}</strong>. This grants full access to their account for up to an hour, is logged, and the school's admin is notified. A reason is required:</p>
     <textarea id="impersonate-reason" placeholder="e.g. Support ticket #123 — investigating a fee balance discrepancy" required
       style="width:100%;height:80px;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;font-family:inherit;resize:vertical"></textarea>`,
    [
      { label:'Cancel', cls:'pa-btn', action:'closeModal()' },
      { label:'Log In as Admin', cls:'pa-btn primary', action:`doImpersonate('${schoolId}')` }
    ]
  );
}

async function doImpersonate(schoolId) {
  const reason = document.getElementById('impersonate-reason')?.value.trim() || '';
  if (!reason) {
    toast('A reason is required to impersonate a school.', 'error');
    return;
  }
  closeModal();
  try {
    const data = await api('POST', `/schools/${schoolId}/impersonate`, { reason });

    // ── Wipe ALL legacy app keys so stale demo data never bleeds into the new school ──
    const LEGACY_KEYS = [
      'innolearn_students','innolearn_teachers','innolearn_classes','innolearn_subjects',
      'innolearn_events','innolearn_messages','innolearn_finance','innolearn_attendance',
      'innolearn_grades','innolearn_behaviour','innolearn_admissions','innolearn_timetable',
      'innolearn_users','innolearn_school','innolearn_academic_years','innolearn_sections',
      'ss_jwt','ss_session',
    ];
    LEGACY_KEYS.forEach(k => localStorage.removeItem(k));
    sessionStorage.clear();

    // ── Store session for the React SPA (key: msingi_session, used by auth store) ──
    // Token is NOT stored here — it lives in the HttpOnly cookie set by the server.
    // Normalise _id → id so isSessionActive() can read user.id.
    //
    // IMPORTANT: this must mirror the SAME slim shape client/src/store/auth.js's
    // saveSession()/_slimUser()/_slimSchool() produce for every real login — this
    // page is a separate static bundle (no build step, can't import that module),
    // so the field list is duplicated here on purpose. Every real login path only
    // ever persists these fields to localStorage; writing the full raw user/school
    // docs here (as this used to do) meant an impersonated session — uniquely —
    // left extra sensitive fields (e.g. the school's Mpesa keys) sitting in
    // localStorage, and skipped moduleRegistry, which every other session-
    // establishing response carries. Keep this list in sync with auth.js if either
    // changes.
    const u = data.user || {};
    const s = data.school || {};
    const sessionPayload = {
      user: {
        id:          u.id || (u._id ? String(u._id) : undefined),
        name:        u.name,
        role:        u.role,
        roles:       u.roles,
        primaryRole: u.primaryRole,
        schoolId:    u.schoolId,
        studentId:   u.studentId  ?? undefined,
        guardianOf:  u.guardianOf ?? undefined,
        studentIds:  u.studentIds ?? undefined,
        photoUrl:    u.photoUrl   ?? undefined,
        permissions: u.permissions ?? undefined,
      },
      school: {
        id:           s.id,
        name:         s.name,
        shortName:    s.shortName,
        slug:         s.slug,
        plan:         s.plan,
        logoUrl:      s.logoUrl      ?? undefined,
        faviconUrl:   s.faviconUrl   ?? undefined,
        primaryColor: s.primaryColor ?? undefined,
        accentColor:  s.accentColor  ?? undefined,
        moduleConfig: s.moduleConfig ?? undefined,
        modulePermissions: s.modulePermissions ?? undefined,
        isActive:     s.isActive,
        academicYear:        s.academicYear        ?? undefined,
        emergencyOnlineMode: s.emergencyOnlineMode  ?? undefined,
      },
      moduleRegistry: data.moduleRegistry || undefined,
      // Populated only when the school's organization has multiSchoolEnabled
      // and this admin has 2+ eligible schools — makes the School Switcher
      // (TopBar.jsx) show up for an impersonated session exactly as it
      // would for a real login, instead of never appearing at all.
      availableSchools: data.availableSchools || [],
    };
    localStorage.setItem('msingi_session', JSON.stringify(sessionPayload));

    const expiryNote = data.expiresAt ? ` — access ends by ${new Date(data.expiresAt).toLocaleTimeString()}` : '';
    toast('Redirecting to school portal…' + expiryNote, 'success');
    setTimeout(() => { window.location.href = '/login'; }, 800);
  } catch (err) {
    toast('Impersonation failed: ' + err.message, 'error');
  }
}

/* ── Change Plan ────────────────────────────────────────── */
function changePlan(schoolId, currentPlan, schoolName, currentExpiry) {
  const PLAN_LABELS = {
    base:       'Base - KSh 250/student/term',
    student:    'Student Portal - KSh 300/student/term',
    family:     'Family Portal - KSh 350/student/term',
    enterprise: 'Enterprise - Custom pricing (contact sales)',
  };
  const opts = ['base','student','family','enterprise']
    .map(p => `<option value="${p}" ${p===currentPlan?'selected':''}>${PLAN_LABELS[p]||p}</option>`)
    .join('');

  // planExpiresAt drives the Settings → Subscription countdown and, once
  // enforcement ships, the plan gate. Prefill the current value; blank
  // means "no expiry" (e.g. enterprise / bootstrap). Use the operator's
  // LOCAL calendar date — toISOString() would show the UTC day and can be
  // one day off from the table (which formats in local time).
  let expiryDay = '';
  if (currentExpiry) {
    const d = new Date(currentExpiry);
    expiryDay = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  showModal(
    `Change Plan - ${schoolName}`,
    `<label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Select New Plan</label>
     <select id="plan-select" style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:14px;font-family:inherit;margin-bottom:14px">
       ${opts}
     </select>
     <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Plan expires on</label>
     <input type="date" id="plan-expiry" value="${expiryDay}"
       style="width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:14px;font-family:inherit" />
     <p style="font-size:11px;color:#94a3b8;margin:6px 0 0">Leave blank for no expiry. The date is the last day the plan is active.</p>`,
    [
      { label:'Cancel', cls:'pa-btn', action:'closeModal()' },
      { label:'Update Plan', cls:'pa-btn primary', action:`doChangePlan('${schoolId}')` }
    ]
  );
}

async function doChangePlan(schoolId) {
  const plan = document.getElementById('plan-select')?.value;
  if (!plan) return;
  const day = document.getElementById('plan-expiry')?.value;
  // Interpret the picked day as the last active day in the operator's
  // timezone, then normalise to ISO for storage.
  const planExpiresAt = day ? new Date(`${day}T23:59:59`).toISOString() : null;
  closeModal();
  try {
    await api('PATCH', `/schools/${schoolId}`, { plan, planExpiresAt });
    toast('Plan updated to ' + plan, 'success');
    renderSchools();
  } catch (err) {
    toast('Failed: ' + err.message, 'error');
  }
}

  picker?.addEventListener('input', () => { hex.value = picker.value; });

  });
}

async function saveOrgBranding(orgId) {
  const org  = _orgsCache.find(o => o.id === orgId);
  const hex  = document.getElementById('brand-color-hex')?.value.trim();
  const tagline = document.getElementById('brand-tagline')?.value.trim();

// Same technique as client/src/utils/imageResize.js (the React app's
// shared resize helper) — reimplemented here in vanilla JS since
// platform.html is a standalone page, not part of the React bundle, and
// can't import it. Downscales in the BROWSER before the image is ever
// uploaded, instead of sending a multi-MB original just to have the
// server reject or (worse) accept it — see DEVELOPER_GUIDE §80: an
// unprojected branding document carrying a real multi-MB image caused
// real production incidents on every page load that read it. SVGs pass
// through unresized (rasterizing a vector logo defeats the point of it
// being one, for a format that's already tiny).
function _resizeImageToDataUrl(file, { maxW = 800, maxH = 800, quality = 0.85, format = 'png' } = {}) {
  if (file.type === 'image/svg+xml') {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.onload = e => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image failed to load'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(format === 'jpeg' ? 'image/jpeg' : 'image/png', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadOrgImage(orgId, kind, inputEl) {
  const file = inputEl.files?.[0];
  if (!file) return;
  inputEl.value = '';

  const resizeOpts = kind === 'logo'
    ? { maxW: 800, maxH: 800, format: 'png' }             // preserve transparency
    : { maxW: 1920, maxH: 1080, format: 'jpeg', quality: 0.8 }; // login background — real photo, compress hard

  try {
    const b64 = await _resizeImageToDataUrl(file, resizeOpts);
    const field = kind === 'logo' ? 'logoBase64' : 'loginBgBase64';
    await api('PUT', `/organizations/${orgId}/${kind}`, { [field]: b64 });
    toast(`${kind === 'logo' ? 'Logo' : 'Login background'} updated.`, 'success');
    // Refresh the cache + modal in place so the new image shows immediately
    // without the admin having to reopen the panel.
    await _refreshOrgsCache();
    closeModal();
    showOrgBranding(orgId);
  } catch (err) {
    toast('Upload failed: ' + err.message, 'error');
  }
}

async function removeOrgImage(orgId, kind) {
  const label = kind === 'logo' ? 'logo' : 'login background';
  if (!confirm(`Remove this organization's ${label}?`)) return;
  try {
    await api('DELETE', `/organizations/${orgId}/${kind}`);
    toast(`${label === 'logo' ? 'Logo' : 'Login background'} removed.`, 'success');
    await _refreshOrgsCache();
    closeModal();
    showOrgBranding(orgId);
  } catch (err) {
    toast('Failed: ' + err.message, 'error');
  }
}

/* Re-fetch organizations into _orgsCache without re-rendering the whole
   panel — used by the branding modal so it can refresh its own preview
   images in place after an upload/remove. */
async function _refreshOrgsCache() {
  try {
    const json = await api('GET', '/organizations');
    _orgsCache = json.organizations || [];
  } catch { /* keep the stale cache rather than throw mid-flow */ }
}

async function grantEntitlement(schoolId) {
  const key       = document.getElementById('ent-key')?.value.trim();
  const notes     = document.getElementById('ent-notes')?.value.trim();

    errEl.textContent = 'Key is required (e.g. ai_reports).';
    errEl.style.display = 'block';

    const json = await api('POST', `/schools/${schoolId}/entitlements`, {
      key,
      notes:     notes || undefined,
      expiresAt: expiresAt ? new Date(expiresAt).toISOString() : undefined,

    errEl.style.display = 'block';

}

async function revokeEntitlement(schoolId, key) {

    await api('DELETE', `/schools/${schoolId}/entitlements/${key}`);
